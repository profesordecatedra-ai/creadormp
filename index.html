          </div>
        </div>
        <div>
          <div class="card">
            <div class="card-head"><span class="card-title">Resumen</span></div>
            <p id="lResumen" style="margin-bottom:14px"></p>
            <div class="btn-row">
              <button class="btn btn-gold" id="lGo">${hayKey ? "⚡ Iniciar producción automática" : "⚡ Crear borradores"}</button>
              <button class="btn btn-red" id="lStop" ${lote.corriendo ? "" : "disabled"}>■ Detener</button>
            </div>
            <p class="note" style="margin-top:12px">Puedes seguir usando el estudio mientras trabaja; no cierres esta pestaña. Si Gemini llega a su límite, el estudio espera y reintenta solo.</p>
          </div>
          ${modoPro() || !hayKey ? `
          <div class="card" style="border-color:rgba(139,92,246,.45)">
            <div class="card-head"><span class="card-title">⭐ Modo Pro · lote en tu Gemini</span></div>
            <p class="small" style="margin-bottom:12px">Arma todos los guiones de una empresa en una sola conversación de Gemini, con tu suscripción.</p>
            <label class="field"><span>Empresa de este lote</span><select id="lProEmp">${B.filter((b) => sel.has(b.id)).map((b) => `<option value="${b.id}">${esc(b.nombre)}</option>`).join("") || `<option value="">Marca una empresa</option>`}</select></label>
            <div class="btn-stack">
              <button class="btn btn-gold" id="lProCopiar">📋 1 · Copiar prompt del lote y abrir Gemini</button>
              <button class="btn btn-violet" id="lProPegar">📥 2 · Pegar la respuesta del lote</button>
            </div>
            <p class="small muted" style="margin-top:10px">Si la respuesta queda cortada, escribe en Gemini “continúa” y copia todo junto. Para varias empresas, repite con la siguiente.</p>
          </div>` : ""}
          <div class="card">
            <div class="card-head"><span class="card-title">Progreso</span><span class="mono muted small" id="lCuenta"></span></div>
            <div class="timebar"><div id="lBar"></div></div>
            <div class="list" id="cola"></div>
          </div>
        </div>
      </div>`;

    const leer = () => {
      const cfg = {
        empresas: $$("[data-emp]").filter((x) => x.checked).map((x) => x.dataset.emp),
        cant: {}, dur: {},
        modo: ($("[name=lModo]:checked") || {}).value || "mios",
        mios: $("#lMios").value,
        voz: $("#lVoz").checked, radio: $("#lRadio").checked,
        fechas: $("#lFechas").checked, desde: $("#lDesde").value, cada: Number($("#lCada").value),
      };
      $$("[data-cant]").forEach((x) => (cfg.cant[x.dataset.cant] = Math.max(0, Math.min(30, Number(x.value) || 0))));
      $$("[data-dur]").forEach((x) => (cfg.dur[x.dataset.dur] = Number(x.value)));
      lote.sel = cfg.empresas;
      lote.cfg = cfg;
      return cfg;
    };
    const resumen = () => {
      const cfg = leer();
      const porEmp = Object.values(cfg.cant).reduce((a, b) => a + b, 0);
      const total = porEmp * cfg.empresas.length;
      const llamadas = hayKey ? total * (cfg.voz ? 2 : 1) + (cfg.modo === "auto" ? cfg.empresas.length : 0) : 0;
      $("#lResumen").innerHTML = total
        ? `Se crearán <b>${total}</b> piezas (${porEmp} por empresa × ${cfg.empresas.length} ${cfg.empresas.length === 1 ? "empresa" : "empresas"}).${hayKey ? ` Unas <b>${llamadas}</b> llamadas a Gemini.` : ""}`
        : `Elige al menos una empresa y una cantidad.`;
      $("#lGo").disabled = !total || lote.corriendo;
      $("#lCamaRow").style.display = cfg.radio ? "" : "none";
    };
    const grid = $(".grid-2", view);
    grid.addEventListener("input", resumen);
    grid.addEventListener("change", resumen);
    $("#lTodas").addEventListener("change", (e) => { $$("[data-emp]").forEach((x) => (x.checked = e.target.checked)); resumen(); });
    $("#lCama").addEventListener("change", (e) => {
      if (e.target.files[0]) { ultimaCama = e.target.files[0]; $("#lCamaNom").textContent = ultimaCama.name; }
    });
    $("#lGo").addEventListener("click", () => {
      const cfg = leer();
      if (cfg.modo === "mios" && !cfg.mios.trim() && hayKey === false) {
        if (!confirm("No escribiste temas. ¿Crear borradores con el nicho de cada empresa como tema?")) return;
      }
      if (cfg.radio && !ultimaCama) return toast("Elige la cama musical para las mezclas de radio, o desactiva esa opción.", "error");
      correrLote(cfg, hayKey);
    });
    $("#lStop").addEventListener("click", () => { lote.cancelar = true; toast("Deteniendo después de la pieza actual…"); });
    const piezasPro = (cfg, bid) => {
      const mios = cfg.mios.split("\n").map((x) => x.trim()).filter(Boolean);
      const out = [];
      let k = 0;
      Object.entries(cfg.cant).forEach(([tipo, n]) => {
        for (let i = 0; i < n; i++) out.push({ tipo, duracion: cfg.dur[tipo], tema: cfg.modo === "mios" && mios.length ? mios[k++ % mios.length] : "" });
      });
      return out;
    };
    const proCopiar = $("#lProCopiar");
    if (proCopiar) proCopiar.addEventListener("click", async () => {
      const cfg = leer(), bid = $("#lProEmp").value, b = S.brand(bid);
      if (!b) return toast("Marca al menos una empresa en el paso 1.", "error");
      const piezas = piezasPro(cfg, bid);
      if (!piezas.length) return toast("Elige cuántas piezas crear en el paso 2.", "error");
      lote.pro = { bid, piezas, cfg };
      const usados = S.state.projects.filter((p) => p.marcaId === bid).map((p) => p.tema || p.titulo).filter(Boolean);
      await copiar(E.promptLote(b, piezas, usados), `Prompt de ${piezas.length} piezas copiado. Pégalo en Gemini y copia toda la respuesta.`);
      abrirEn(LINKS.gemini);
    });
    const proPegar = $("#lProPegar");
    if (proPegar) proPegar.addEventListener("click", () => pegarRespuesta("Pegar la respuesta del lote", (t) => {
      const res = E.parseLote(t);
      const info = lote.pro && lote.pro.bid === $("#lProEmp").value ? lote.pro : { bid: $("#lProEmp").value, piezas: piezasPro(leer()), cfg: leer() };
      const b = S.brand(info.bid);
      if (!b) throw new Error("Elige la empresa del lote.");
      const fecha = info.cfg.fechas && info.cfg.desde ? new Date(info.cfg.desde + "T12:00:00") : null;
      lote.cola = [];
      res.forEach((x, i) => {
        const base = info.piezas[(x.n || i + 1) - 1] || info.piezas[i] || { tipo: E.TIPOS[x.tipo] ? x.tipo : "short", duracion: 30 };
        const tipo = E.TIPOS[x.tipo] ? x.tipo : base.tipo;
        const p = nuevoProyecto(tipo, info.bid);
        Object.assign(p, { duracion: base.duracion || p.duracion, tema: base.tema || x.r.titulo, resultado: x.r, titulo: x.r.titulo || base.tema || E.TIPOS[tipo].label, estado: "guion", plataformas: PLAT[tipo] });
        if (fecha) { p.fecha = fecha.toISOString().slice(0, 10); fecha.setDate(fecha.getDate() + info.cfg.cada); }
        S.upsertProject(p);
        lote.cola.push({ bid: info.bid, tipo, estado: "listo", msg: "", pid: p.id, tema: p.tema, titulo: p.titulo });
      });
      pintarCola();
      toast(`${res.length} guiones de ${b.nombre} importados ✓`, "ok");
    }));
    resumen();
    pintarCola();
  }

  function pintarCola() {
    const cont = $("#cola");
    if (!cont) return;
    const total = lote.cola.length;
    const hechos = lote.cola.filter((x) => ["listo", "error", "cancelado"].includes(x.estado)).length;
    $("#lCuenta").textContent = total ? `${hechos}/${total}` : "";
    $("#lBar").style.width = total ? (hechos / total) * 100 + "%" : "0";
    const stop = $("#lStop");
    if (stop) stop.disabled = !lote.corriendo;
    const go = $("#lGo");
    if (go && lote.corriendo) go.disabled = true;
    cont.innerHTML = total
      ? lote.cola.map((it) => {
          const b = S.brand(it.bid);
          const [cls, txt] = ESTADO_COLA[it.estado] || ["", it.estado];
          return `<div class="list-item">
            <span style="min-width:0">${E.TIPOS[it.tipo].icono} <b>${esc(b ? b.nombre : "")}</b>
              <span class="muted small">· ${esc(it.titulo || it.tema || E.TIPOS[it.tipo].label)}</span>
              ${it.msg ? `<br><span class="small" style="color:${it.estado === "error" ? "var(--red)" : "var(--gold-2)"}">${esc(it.msg)}</span>` : ""}</span>
            <span class="btn-row" style="flex-shrink:0"><span class="chip ${cls}">${txt}</span>${it.pid && S.project(it.pid) ? `<a class="btn btn-ghost btn-sm" href="#/estudio/${it.pid}">Abrir</a>` : ""}</span>
          </div>`;
        }).join("")
      : `<p class="muted small">Aquí verás cada pieza mientras se produce.</p>`;
  }

  async function correrLote(cfg, hayKey) {
    if (lote.corriendo) return;
    lote.corriendo = true;
    lote.cancelar = false;
    lote.cola = [];
    const tipos = Object.entries(cfg.cant).filter(([, n]) => n > 0);
    cfg.empresas.forEach((bid) => tipos.forEach(([tipo, n]) => {
      for (let i = 0; i < n; i++) lote.cola.push({ bid, tipo, dur: cfg.dur[tipo], estado: "pendiente", msg: "", pid: null, tema: "", titulo: "" });
    }));
    pintarCola();
    const mios = cfg.mios.split("\n").map((x) => x.trim()).filter(Boolean);
    let k = 0;

    for (const bid of cfg.empresas) {
      if (lote.cancelar) break;
      const b = S.brand(bid);
      const items = lote.cola.filter((x) => x.bid === bid);
      let temas = {};
      if (cfg.modo === "auto" && hayKey) {
        items.forEach((x) => (x.estado = "temas"));
        pintarCola();
        try {
          const usados = S.state.projects.filter((p) => p.marcaId === bid).map((p) => p.tema || p.titulo).filter(Boolean);
          temas = E.parseTemas(await reintentar(() => G.texto(E.promptTemas(b, cfg.cant, usados), true), items[0]));
        } catch (e) {
          toast(`No se pudieron proponer temas para ${b.nombre}: ${e.message}. Sigo con temas libres.`, "error");
        }
        items.forEach((x) => (x.estado = "pendiente"));
      }
      const idx = {};
      const fecha = cfg.fechas && cfg.desde ? new Date(cfg.desde + "T12:00:00") : null;

      for (const it of items) {
        if (lote.cancelar) { it.estado = "cancelado"; continue; }
        idx[it.tipo] = idx[it.tipo] || 0;
        it.tema = cfg.modo === "mios" ? mios.length ? mios[k++ % mios.length] : b.nicho || "" : (temas[it.tipo] || [])[idx[it.tipo]++] || "";
        const p = nuevoProyecto(it.tipo, bid);
        Object.assign(p, { duracion: it.dur, tema: it.tema, plataformas: PLAT[it.tipo], titulo: (it.tema || E.TIPOS[it.tipo].label).slice(0, 80) });
        if (fecha) { p.fecha = fecha.toISOString().slice(0, 10); fecha.setDate(fecha.getDate() + cfg.cada); }
        S.upsertProject(p);
        it.pid = p.id;
        it.estado = "guion";
        pintarCola();
        try {
          if (hayKey) p.resultado = E.parse(await reintentar(() => G.texto(E.promptMaestro(p, b), true), it));
          else p.resultado = E.borrador(p, b);
          p.titulo = p.resultado.titulo || p.titulo;
          it.titulo = p.titulo;
          p.estado = "guion";
          S.upsertProject(p);
          if (cfg.voz && hayKey && !lote.cancelar) {
            it.estado = "voz";
            pintarCola();
            const voice = (b.voz && b.voz.voice) || "Kore";
            const estilo = p.resultado.voz.estilo || (b.voz && b.voz.estilo) || "";
            const blob = await reintentar(() => G.voz(E.textoHablado(p.resultado, p.tipo), voice, estilo), it);
            await guardarToma(p, blob, { voice, estilo, origen: "Gemini" });
            if (cfg.radio && ultimaCama && (p.tipo === "cuna" || p.tipo === "jingle")) {
              it.estado = "radio";
              pintarCola();
              const mix = await VS.radio.mezclar({ voz: blob, musica: ultimaCama, intro: 2, outro: 3, volAlto: 0.8, volBajo: 0.22, volVoz: 1 });
              await guardarToma(p, mix.blob, { voice: "Mezcla radio", estilo: `${voice} + ${ultimaCama.name}`, origen: "Mezcla" });
            }
          }
          it.estado = "listo";
          it.msg = "";
        } catch (e) {
          it.estado = "error";
          it.msg = e.message;
        }
        pintarCola();
        await espera(400);
      }
    }
    lote.cola.forEach((x) => { if (x.estado === "pendiente") x.estado = "cancelado"; });
    lote.corriendo = false;
    pintarCola();
    const ok = lote.cola.filter((x) => x.estado === "listo").length;
    toast(`Producción terminada: ${ok} de ${lote.cola.length} piezas listas.`, ok ? "ok" : "error");
  }

  /* ---------- Paquete ZIP por empresa ---------- */
  let zipLib = null;
  function cargarZip() {
    if (window.JSZip) return Promise.resolve(window.JSZip);
    if (!zipLib) {
      zipLib = new Promise((res, rej) => {
        const sc = document.createElement("script");
        sc.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
        sc.onload = () => res(window.JSZip);
        sc.onerror = () => { zipLib = null; rej(new Error("No se pudo cargar el compresor ZIP. Revisa tu conexión.")); };
        document.head.appendChild(sc);
      });
    }
    return zipLib;
  }

  async function paqueteEmpresa(b, btn) {
    const ps = S.state.projects.filter((p) => p.marcaId === b.id && p.resultado);
    if (!ps.length) return toast("Esta empresa aún no tiene guiones.", "error");
    cargando(btn, true, "Armando…");
    try {
      const JSZip = await cargarZip();
      const zip = new JSZip();
      let audios = 0;
      for (const p of ps) {
        const f = zip.folder(`${E.TIPOS[p.tipo].label.split(" ")[0]} - ${slug(p.titulo)}`);
        f.file("ficha.txt", E.ficha(p, b));
        f.file("kit-redes.txt", E.kitTexto(p.resultado));
        if (E.TIPOS[p.tipo].video) {
          f.file("prompts-veo.txt", E.prompsVeoTexto(p.resultado));
          f.file("subtitulos.srt", E.srtEscenas(p.resultado));
        }
        if (p.resultado.prompt_musica) f.file("prompt-musica.txt", p.resultado.prompt_musica);
        for (const k of await VS.media.keys(p.id + "__voz__")) {
          const t = await VS.media.get(k);
          if (!t || !t.blob) continue;
          const ext = (t.blob.type.split("/")[1] || "wav").replace("mpeg", "mp3").split(";")[0];
          f.file(`${slug(t.voice)}-${k.split("__").pop()}.${ext}`, t.blob);
          audios++;
        }
      }
      const out = await zip.generateAsync({ type: "blob" });
      descargar(`${slug(b.nombre)}-paquete-${new Date().toISOString().slice(0, 10)}.zip`, out);
      toast(`Paquete listo: ${ps.length} piezas y ${audios} audios ✓`, "ok");
    } catch (e) {
      toast(e.message, "error");
    } finally {
      cargando(btn, false);
    }
  }

  /* =========================================================
     AYUDA
     ========================================================= */
  const MANUAL_URL = "https://claude.ai/artifact/4JvEz8GASuHBiJ9RBXW9sa";

  function vAyuda() {
    const paso = (n, ico, t, d, href) => `
      <a class="card" href="${href}" style="text-decoration:none;display:block;margin:0">
        <div style="display:flex;gap:12px;align-items:flex-start">
          <span class="qi" style="width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;background:rgba(245,165,36,.12);flex-shrink:0">${ico}</span>
          <span><span class="eyebrow" style="margin:0">Paso ${n}</span><h3>${t}</h3><p class="muted small" style="margin-top:4px">${d}</p></span>
        </div>
      </a>`;
    view.innerHTML = `
      <div class="page-head">
        <div><span class="eyebrow">Ayuda</span><h1>Cómo usar el estudio</h1><p>El recorrido de una pieza, de la idea al archivo listo.</p></div>
        ${MANUAL_URL ? `<a class="btn btn-gold" href="${MANUAL_URL}" target="_blank" rel="noopener">Abrir manual completo ↗</a>` : ""}
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px">
        ${paso(1, "🏷️", "Crea tus empresas", "Nicho, productos, contacto, estética y voz. Es la base de todo lo que se genera.", "#/marcas")}
        ${paso(2, "⚡", "Producción automática", "Elige empresas y cantidades: temas, guiones y voces se crean solos.", "#/auto")}
        ${paso(3, "✨", "Revisa y ajusta guiones", "Edita la locución, copia los prompts de Veo y abre Flow.", "#/estudio")}
        ${paso(4, "🎙️", "Voz y radio", "Genera o cambia la voz y mezcla cuñas y jingles con cama musical.", "#/voz")}
        ${paso(5, "🎬", "Video de muestra", "Arrastra los clips de Flow; voz y subtítulos ya vienen listos.", "#/ensamblador")}
        ${paso(6, "📦", "Entrega", "Descarga el paquete de cada empresa y marca la pieza como publicada.", "#/marcas")}
      </div>
      <div class="card" style="margin-top:14px">
        <div class="card-head"><span class="card-title">Atajos útiles</span></div>
        <div class="list">
          <div class="list-item"><span><b>Sin API key</b> <span class="muted small">· “Copiar prompt maestro” → pégalo en Gemini → “Pegar respuesta”.</span></span></div>
          <div class="list-item"><span><b>Palabras de más</b> <span class="muted small">· el contador de cada escena se pone rojo si la locución no cabe en el clip.</span></span></div>
          <div class="list-item"><span><b>Pausas y énfasis en la voz</b> <span class="muted small">· MAYÚSCULAS para enfatizar, &lt;short pause&gt; para pausar.</span></span></div>
          <div class="list-item"><span><b>Otro PC</b> <span class="muted small">· Ajustes → Exportar respaldo aquí, e Importar respaldo allá. Viajan empresas, guiones y audios.</span></span></div>
          <div class="list-item"><span><b>Exportar video</b> <span class="muted small">· usa Chrome o Edge en computador y deja la pestaña visible.</span></span></div>
        </div>
      </div>`;
  }

  const VIEWS = { panel: vPanel, estudio: vEstudio, auto: vAuto, voz: vVoz, ensamblador: vEns, marcas: vMarcas, ajustes: vAjustes, ayuda: vAyuda };
  window.addEventListener("hashchange", render);
  view.innerHTML = `<div class="empty" style="padding-top:18vh"><div class="big">🎙️</div><h2>Abriendo tu estudio…</h2><p>Cargando tus empresas y proyectos.</p></div>`;
  const LOCK = "vocalis.clave";
  async function huella(t) {
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("vocalis:" + t));
    return Array.from(new Uint8Array(b)).map((x) => x.toString(16).padStart(2, "0")).join("");
  }
  const leerLock = () => { try { return localStorage.getItem(LOCK) || ""; } catch (e) { return ""; } };

  S.iniciar().then((r) => {
    if (r && r.acceso) return pantallaAcceso(r.acceso);
    let abierto = false;
    try { abierto = sessionStorage.getItem("vocalis.ok") === "1"; } catch (e) { /* */ }
    if (!S.cloud.on && leerLock() && !abierto) return pantallaBloqueo();
    aplicarNombre();
    render();
  });

  /* ---------- Clave de este equipo (modo sencillo) ---------- */
  function pantallaBloqueo() {
    aplicarNombre();
    const nombre = S.state.settings.appName || "Vocalis Studio";
    document.title = nombre + " · Entrar";
    $(".side").style.display = "none";
    $(".app").style.gridTemplateColumns = "1fr";
    view.innerHTML = `
      <div style="min-height:80vh;display:grid;place-items:center">
        <div class="card" style="width:min(380px,100%);padding:28px 24px">
          <span class="brand-icon ${logoActual() ? "has-logo" : ""}" style="width:52px;height:52px;margin-bottom:16px">${logoHtml()}</span>
          <h1 style="font-size:1.4rem">${esc(nombre)}</h1>
          <p class="muted" style="margin:6px 0 18px">Estudio privado. Ingresa tu clave.</p>
          <form id="fLock">
            <input type="password" id="lkPass" placeholder="Clave" autocomplete="current-password" required style="margin-bottom:12px">
            <p class="small" id="lkErr" style="color:var(--red);margin:-4px 0 10px" hidden>Clave incorrecta.</p>
            <button class="btn btn-gold btn-block" type="submit">Entrar</button>
          </form>
        </div>
      </div>`;
    $("#lkPass").focus();
    $("#fLock").addEventListener("submit", async (e) => {
      e.preventDefault();
      if ((await huella($("#lkPass").value)) === leerLock()) {
        try { sessionStorage.setItem("vocalis.ok", "1"); } catch (err) { /* */ }
        $(".side").style.display = "";
        $(".app").style.gridTemplateColumns = "";
        aplicarNombre();
        render();
      } else {
        await new Promise((r) => setTimeout(r, 700));
        $("#lkErr").hidden = false;
        $("#lkPass").select();
      }
    });
  }

  /* ---------- Pantalla de contraseña ---------- */
  function pantallaAcceso(tipo) {
    const nombre = localStorage.getItem("vocalis.nombre") || "Vocalis Studio";
    document.title = nombre + " · Entrar";
    $(".side").style.display = "none";
    $(".app").style.gridTemplateColumns = "1fr";
    view.innerHTML = `
      <div style="min-height:80vh;display:grid;place-items:center">
        <div class="card" style="width:min(380px,100%);padding:28px 24px">
          <span class="brand-icon ${logoActual() ? "has-logo" : ""}" style="width:52px;height:52px;margin-bottom:16px">${logoHtml()}</span>
          <h1 style="font-size:1.4rem">${esc(nombre)}</h1>
          ${tipo === "config"
            ? `<p class="muted" style="margin:6px 0 14px">Falta configurar la contraseña.</p>
               <p class="note warn">En Netlify ve a <b>Project configuration → Environment variables</b>, crea <span class="mono">STUDIO_PASSWORD</span> con tu contraseña y vuelve a publicar (<b>Deploys → Trigger deploy</b>).</p>`
            : `<p class="muted" style="margin:6px 0 18px">Estudio privado. Ingresa tu contraseña.</p>
               <form id="fAcceso">
                 <input type="password" id="aPass" placeholder="Contraseña" autocomplete="current-password" required style="margin-bottom:12px">
                 <p class="small" id="aErr" style="color:var(--red);margin:-4px 0 10px" hidden></p>
                 <button class="btn btn-gold btn-block" type="submit" id="aBtn">Entrar</button>
               </form>`}
        </div>
      </div>`;
    const f = $("#fAcceso");
    if (!f) return;
    $("#aPass").focus();
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = $("#aBtn");
      cargando(btn, true, "Entrando…");
      try {
        const r = await fetch("/api/entrar", { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify({ password: $("#aPass").value }) });
        if (r.ok) { location.reload(); return; }
        const d = await r.json().catch(() => ({}));
        $("#aErr").textContent = d.error || "No se pudo entrar.";
        $("#aErr").hidden = false;
        $("#aPass").select();
      } catch (err) {
        $("#aErr").textContent = "Sin conexión. Intenta de nuevo.";
        $("#aErr").hidden = false;
      }
      cargando(btn, false);
    });
  }
  window.addEventListener("beforeunload", (e) => {
    if (S.cloud.on && S.cloud.estado === "guardando") { e.preventDefault(); e.returnValue = ""; }
  });
})(window.VS);

</script>
