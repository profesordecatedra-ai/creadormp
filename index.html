      if (cual === "musica") a.loop = true;
      await new Promise((res) => { a.onloadedmetadata = res; a.onerror = res; });
      this[cual] = a;
      this._conectado = false;
      return isFinite(a.duration) ? a.duration : 0;
    }

    duracionVoz() {
      return this.voz && isFinite(this.voz.duration) ? this.voz.duration : 0;
    }

    linea() {
      // calcula inicio/fin de cada elemento
      const dv = this.duracionVoz();
      const n = this.items.length;
      let total = 0;
      const tramos = this.items.map((it) => {
        const d = this.ajustar && dv && n ? dv / n : it.dur;
        const t = { it, start: total, end: total + d };
        total += d;
        return t;
      });
      if (!n && dv) total = dv;
      return { tramos, total: Math.max(total, dv ? dv : 0) || 0 };
    }

    /* ---------- Dibujo ---------- */
    cubrir(src, sw, sh, zoom) {
      const { cv, ctx } = this;
      if (!sw || !sh) return;
      const s = Math.max(cv.width / sw, cv.height / sh) * (zoom || 1);
      const w = sw * s, h = sh * s;
      ctx.drawImage(src, (cv.width - w) / 2, (cv.height - h) / 2, w, h);
    }

    // Imagen completa, sin recortes (como Instagram, TikTok y Facebook)
    contener(src, sw, sh, zoom) {
      const { cv, ctx } = this;
      if (!sw || !sh) return;
      const s = Math.min(cv.width / sw, cv.height / sh) * (zoom || 1);
      const w = sw * s, h = sh * s;
      ctx.drawImage(src, (cv.width - w) / 2, (cv.height - h) / 2, w, h);
    }

    // Fondo difuminado hecho con la misma imagen: se reduce a un lienzo diminuto y se amplía
    fondoDifuso(it, src, sw, sh) {
      const { cv, ctx } = this;
      if (!sw || !sh) return;
      const bw = 27, bh = Math.max(12, Math.round((27 * cv.height) / cv.width));
      if (!it.bg || it.bg.width !== bw || it.bg.height !== bh) {
        it.bg = document.createElement("canvas");
        it.bg.width = bw;
        it.bg.height = bh;
        it.bgListo = false;
      }
      if (!it.bgListo || it.tipo === "video") {
        const b = it.bg.getContext("2d");
        const k = Math.max(bw / sw, bh / sh) * 1.15;
        b.drawImage(src, (bw - sw * k) / 2, (bh - sh * k) / 2, sw * k, sh * k);
        it.bgListo = it.tipo === "imagen" && sw > 0;
      }
      ctx.save();
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(it.bg, 0, 0, cv.width, cv.height);
      ctx.fillStyle = "rgba(0,0,0,.28)";
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.restore();
    }

    pintarFuente(it, src, sw, sh, zoom) {
      if (this.encuadre === "llenar") return this.cubrir(src, sw, sh, zoom);
      if (this.encuadre === "color") {
        this.ctx.fillStyle = this.colorFondo || "#000000";
        this.ctx.fillRect(0, 0, this.cv.width, this.cv.height);
      } else {
        this.fondoDifuso(it, src, sw, sh);
      }
      // "Movimiento suave": acercamiento lento solo en imágenes, si se activa
      this.contener(src, sw, sh, this.movimiento && it.tipo === "imagen" ? 1 + (zoom - 1) * 0.75 : 1);
    }

    // Dibuja un tramo completo (fondo + imagen o clip) con opacidad y desplazamiento opcionales
    pintarTramo(tr, t, alpha, dx, escala) {
      const { ctx, cv } = this;
      const it = tr.it;
      const local = Math.max(0, Math.min(t, tr.end) - tr.start);
      const prog = (tr.end - tr.start) ? local / (tr.end - tr.start) : 0;
      ctx.save();
      ctx.globalAlpha = alpha == null ? 1 : alpha;
      if (dx) ctx.translate(dx, 0);
      if (escala && escala !== 1) {
        ctx.translate(cv.width / 2, cv.height / 2);
        ctx.scale(escala, escala);
        ctx.translate(-cv.width / 2, -cv.height / 2);
      }
      if (it.tipo === "imagen") {
        this.pintarFuente(it, it.el, it.el.naturalWidth, it.el.naturalHeight, 1 + 0.08 * prog); // Ken Burns solo al llenar
      } else {
        if (!this.reproduciendo && !this.exacto) {
          const want = Math.min(local % (it.el.duration || 8), (it.el.duration || 8) - 0.05);
          if (Math.abs(it.el.currentTime - want) > 0.3) it.el.currentTime = want;
        }
        this.pintarFuente(it, it.el, it.el.videoWidth, it.el.videoHeight, 1);
      }
      ctx.restore();
    }

    // Qué tramos se ven en el instante t (dos durante una transición)
    visibles(t) {
      const { tramos } = this.linea();
      if (!tramos.length) return { tramos, i: -1 };
      let i = tramos.findIndex((x) => t >= x.start && t < x.end);
      if (i < 0) i = t < tramos[0].start ? 0 : tramos.length - 1;
      const tr = tramos[i];
      const D = Math.min(this.durTrans, (tr.end - tr.start) / 2);
      const enTrans = this.transicion !== "ninguna" && i > 0 && t - tr.start < D;
      return { tramos, i, tr, prev: enTrans ? tramos[i - 1] : null, p: enTrans ? (t - tr.start) / D : 1 };
    }

    dibujar(t) {
      const { cv, ctx } = this;
      ctx.fillStyle = "#05070e";
      ctx.fillRect(0, 0, cv.width, cv.height);
      const v = this.visibles(t);
      if (!v.tr) {
        this.vacio();
      } else if (!v.prev) {
        this.pintarTramo(v.tr, t);
      } else {
        const p = v.p, e = p * p * (3 - 2 * p); // suavizado
        const tPrev = v.prev.end - 0.001;
        switch (this.transicion) {
          case "negro":
            if (p < 0.5) {
              this.pintarTramo(v.prev, tPrev);
              ctx.fillStyle = `rgba(0,0,0,${Math.min(1, p * 2)})`;
            } else {
              this.pintarTramo(v.tr, t);
              ctx.fillStyle = `rgba(0,0,0,${Math.min(1, (1 - p) * 2)})`;
            }
            ctx.fillRect(0, 0, cv.width, cv.height);
            break;
          case "deslizar":
            this.pintarTramo(v.prev, tPrev, 1, -e * cv.width);
            this.pintarTramo(v.tr, t, 1, (1 - e) * cv.width);
            break;
          case "zoom":
            this.pintarTramo(v.prev, tPrev, 1, 0, 1 + 0.12 * e);
            this.pintarTramo(v.tr, t, e, 0, 1.12 - 0.12 * e);
            break;
          default: // fundido cruzado
            this.pintarTramo(v.prev, tPrev);
            this.pintarTramo(v.tr, t, e);
        }
      }
      this.dibujarSubtitulo(t);
      this.dibujarMarca();
    }

    vacio() {
      const { cv, ctx } = this;
      const g = ctx.createLinearGradient(0, 0, cv.width, cv.height);
      g.addColorStop(0, "#1a1430");
      g.addColorStop(1, "#0b1020");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = "rgba(255,255,255,.55)";
      ctx.font = `600 ${Math.round(cv.width * 0.04)}px "Plus Jakarta Sans", sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText("Agrega clips o imágenes", cv.width / 2, cv.height / 2);
    }

    dibujarSubtitulo(t) {
      if (!this.subs.length) return;
      const g = this.subs.find((x) => t >= x.start && t < x.end);
      if (!g) return;
      const { cv, ctx, estilo } = this;
      const base = Math.min(cv.width, cv.height);
      const fs = Math.round(base * 0.068 * (estilo.tam || 1));
      ctx.font = `800 ${fs}px "Plus Jakarta Sans", sans-serif`;
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      const palabras = g.words.map((w) => (estilo.mayus ? w.w.toUpperCase() : w.w));
      const esp = ctx.measureText(" ").width;
      const maxW = cv.width * 0.84;
      // partir en líneas
      const lineas = [[]];
      let ancho = 0;
      palabras.forEach((p, i) => {
        const w = ctx.measureText(p).width;
        if (ancho + w > maxW && lineas[lineas.length - 1].length) { lineas.push([]); ancho = 0; }
        lineas[lineas.length - 1].push(i);
        ancho += w + esp;
      });
      const lh = fs * 1.22;
      const altoBloque = lineas.length * lh;
      const yc = estilo.posicion === "superior" ? cv.height * 0.12 : estilo.posicion === "centro" ? cv.height * 0.5 : estilo.posicion === "franja" ? cv.height * 0.9 : cv.height * 0.74;
      const y0 = yc - altoBloque / 2 + lh / 2;
      const anchos = lineas.map((l) => l.reduce((a, i) => a + ctx.measureText(palabras[i]).width, 0) + esp * (l.length - 1));
      const maxL = Math.max(...anchos);
      if (estilo.caja !== "ninguna") {
        const pad = fs * 0.45;
        const x = (cv.width - maxL) / 2 - pad, y = y0 - lh / 2 - pad * 0.6;
        const w = maxL + pad * 2, h = altoBloque + pad * 1.2;
        ctx.fillStyle = estilo.caja === "solida" ? "rgba(0,0,0,.82)" : "rgba(10,15,29,.55)";
        redondeado(ctx, x, y, w, h, fs * 0.35);
        ctx.fill();
        if (estilo.caja === "glass") {
          ctx.strokeStyle = "rgba(255,255,255,.18)";
          ctx.lineWidth = Math.max(2, fs * 0.04);
          ctx.stroke();
        }
      }
      lineas.forEach((l, li) => {
        let x = (cv.width - anchos[li]) / 2;
        const y = y0 + li * lh;
        l.forEach((i) => {
          const w = g.words[i];
          const activa = t >= w.start && t < w.end;
          ctx.lineWidth = fs * 0.14;
          ctx.strokeStyle = "rgba(0,0,0,.85)";
          ctx.lineJoin = "round";
          ctx.strokeText(palabras[i], x, y);
          ctx.fillStyle = activa ? estilo.color : "#ffffff";
          ctx.fillText(palabras[i], x, y);
          x += ctx.measureText(palabras[i]).width + esp;
        });
      });
    }

    dibujarMarca() {
      const { cv, ctx } = this;
      const base = Math.min(cv.width, cv.height);
      if (this.marca) {
        ctx.font = `700 ${Math.round(base * 0.032)}px "Plus Jakarta Sans", sans-serif`;
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillStyle = "rgba(255,255,255,.85)";
        ctx.shadowColor = "rgba(0,0,0,.6)";
        ctx.shadowBlur = 8;
        ctx.fillText(this.marca, base * 0.05, base * 0.05);
        ctx.shadowBlur = 0;
      }
      if (this.muestra) {
        ctx.save();
        ctx.translate(cv.width / 2, cv.height / 2);
        ctx.rotate(-Math.PI / 7);
        ctx.font = `900 ${Math.round(base * 0.16)}px "Plus Jakarta Sans", sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "rgba(255,255,255,.13)";
        ctx.fillText("MUESTRA", 0, 0);
        ctx.restore();
      }
    }

    /* ---------- Audio ---------- */
    conectarAudio() {
      if (!this.ac) this.ac = new (window.AudioContext || window.webkitAudioContext)();
      if (!this.dest) this.dest = this.ac.createMediaStreamDestination();
      this.nodos = this.nodos || new Map();
      ["voz", "musica"].forEach((k) => {
        const el = this[k];
        if (!el) return;
        if (!this.nodos.has(el)) {
          const src = this.ac.createMediaElementSource(el);
          const g = this.ac.createGain();
          src.connect(g);
          g.connect(this.ac.destination);
          g.connect(this.dest);
          this.nodos.set(el, g);
        }
        this.nodos.get(el).gain.value = k === "voz" ? this.volVoz : this.volMusica;
      });
    }

    /* ---------- Reproducción ---------- */
    async reproducir(grabando) {
      const { total, tramos } = this.linea();
      if (!total) throw new Error("Agrega clips, imágenes o una voz antes de reproducir.");
      this.detener(true);
      this.conectarAudio();
      if (this.ac.state === "suspended") await this.ac.resume();
      this.reproduciendo = true;
      this.total = total;
      [this.voz, this.musica].forEach((a) => { if (a) { a.currentTime = 0; a.play().catch(() => {}); } });
      tramos.forEach((t) => { if (t.it.tipo === "video") { t.it.el.pause(); t.it.el.currentTime = 0; } });
      let actual = -1;
      const t0 = performance.now();
      const paso = () => {
        if (!this.reproduciendo) return;
        const t = (performance.now() - t0) / 1000;
        const i = tramos.findIndex((x) => t >= x.start && t < x.end);
        if (i !== actual) {
          if (actual >= 0 && tramos[actual].it.tipo === "video") tramos[actual].it.el.pause();
          if (i >= 0 && tramos[i].it.tipo === "video") {
            const v = tramos[i].it.el;
            v.currentTime = 0;
            v.play().catch(() => {});
          }
          actual = i;
        }
        // desvanecer la música en el último segundo
        if (this.musica && this.nodos && this.nodos.has(this.musica)) {
          const rest = total - t;
          this.nodos.get(this.musica).gain.value = this.volMusica * Math.max(0, Math.min(1, rest));
        }
        this.dibujar(Math.min(t, total - 0.001));
        this.alAvanzar && this.alAvanzar(t, total);
        if (t >= total) {
          this.detener();
          this.alTerminar && this.alTerminar();
          return;
        }
        this.raf = requestAnimationFrame(paso);
      };
      this.raf = requestAnimationFrame(paso);
    }

    detener(silencioso) {
      this.reproduciendo = false;
      cancelAnimationFrame(this.raf);
      [this.voz, this.musica].forEach((a) => a && a.pause());
      this.items.forEach((it) => it.tipo === "video" && it.el.pause());
      if (!silencioso) this.dibujar(0);
    }

    static tipoGrabacion() {
      const opciones = [
        "video/mp4;codecs=avc1.42E01F,mp4a.40.2",
        "video/mp4;codecs=avc1,mp4a",
        "video/mp4",
        "video/webm;codecs=vp9,opus",
        "video/webm;codecs=vp8,opus",
        "video/webm",
      ];
      return opciones.find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
    }

    /* ---------- Exportación cuadro por cuadro (WebCodecs) ---------- */
    static async codecs(w, h, bitrate) {
      if (!window.VideoEncoder || !window.AudioEncoder || !window.VideoFrame || !window.AudioData) return null;
      const ok = async (fn, cfg) => { try { return (await fn.isConfigSupported(cfg)).supported ? cfg : null; } catch (e) { return null; } };
      const fps = 30;
      let video = null, vtipo = "avc";
      for (const c of ["avc1.640028", "avc1.4d0028", "avc1.42e028", "avc1.640032"]) {
        video = await ok(VideoEncoder, { codec: c, width: w, height: h, bitrate, framerate: fps, avc: { format: "avc" } });
        if (video) break;
      }
      let audio = await ok(AudioEncoder, { codec: "mp4a.40.2", sampleRate: 48000, numberOfChannels: 2, bitrate: 160000 });
      let atipo = "aac";
      if (!video) {
        vtipo = "vp9";
        video = await ok(VideoEncoder, { codec: "vp09.00.40.08", width: w, height: h, bitrate, framerate: fps });
      }
      if (!audio) {
        atipo = "opus";
        audio = await ok(AudioEncoder, { codec: "opus", sampleRate: 48000, numberOfChannels: 2, bitrate: 160000 });
      }
      if (!video || !audio) return null;
      return { video, audio, vtipo, atipo, fps };
    }

    async blobDe(cual) {
      if (this[cual + "Blob"]) return this[cual + "Blob"];
      if (this[cual + "Url"]) return await (await fetch(this[cual + "Url"])).blob();
      if (this[cual] && this[cual].src) return await (await fetch(this[cual].src)).blob();
      return null;
    }

    // Mezcla voz + música (en bucle, con salida suave) en un búfer de 48 kHz estéreo
    async mezclarAudio(total) {
      const SR = 48000;
      const largo = Math.max(1, Math.ceil(total * SR));
      const off = new OfflineAudioContext(2, largo, SR);
      const dec = new (window.AudioContext || window.webkitAudioContext)();
      try {
        const poner = async (blob, vol, loop) => {
          if (!blob) return;
          const buf = await dec.decodeAudioData(await blob.arrayBuffer());
          const src = off.createBufferSource();
          src.buffer = buf;
          src.loop = !!loop;
          const g = off.createGain();
          g.gain.setValueAtTime(vol, 0);
          if (loop) {
            g.gain.setValueAtTime(vol, Math.max(0, total - 1));
            g.gain.linearRampToValueAtTime(0, total);
          }
          src.connect(g).connect(off.destination);
          src.start(0);
        };
        await poner(await this.blobDe("voz"), this.volVoz, false);
        await poner(await this.blobDe("musica"), this.volMusica, true);
      } finally {
        dec.close && dec.close();
      }
      return off.startRendering();
    }

    async codificarAudio(buffer, cfg) {
      const chunks = [];
      let desc = null, err = null;
      const enc = new AudioEncoder({
        output: (c, meta) => {
          if (meta && meta.decoderConfig && meta.decoderConfig.description && !desc) desc = new Uint8Array(meta.decoderConfig.description);
          const d = new Uint8Array(c.byteLength);
          c.copyTo(d);
          chunks.push({ data: d, ts: c.timestamp, dur: c.duration || Math.round((1024 * 1e6) / 48000) });
        },
        error: (e) => (err = e),
      });
      enc.configure(cfg);
      const N = 4800, ch = buffer.numberOfChannels, SR = buffer.sampleRate;
      const L = buffer.getChannelData(0), R = ch > 1 ? buffer.getChannelData(1) : L;
      for (let o = 0; o < buffer.length; o += N) {
        const n = Math.min(N, buffer.length - o);
        const plano = new Float32Array(n * 2);
        plano.set(L.subarray(o, o + n), 0);
        plano.set(R.subarray(o, o + n), n);
        const ad = new AudioData({ format: "f32-planar", sampleRate: SR, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round((o * 1e6) / SR), data: plano });
        enc.encode(ad);
        ad.close();
        if (err) throw err;
      }
      await enc.flush();
      enc.close();
      if (err) throw err;
      return { chunks, desc };
    }

    // Lleva cada clip visible al cuadro exacto antes de dibujar
    async prepararCuadro(t) {
      const v = this.visibles(t);
      const lista = [];
      if (v.tr) lista.push([v.tr, t]);
      if (v.prev) lista.push([v.prev, v.prev.end - 0.001]);
      for (const [tr, tt] of lista) {
        if (tr.it.tipo !== "video") continue;
        const el = tr.it.el, d = el.duration || 8;
        const local = Math.max(0, tt - tr.start);
        const want = Math.min(local % d, d - 0.04);
        if (Math.abs(el.currentTime - want) < 0.004 && el.readyState >= 2) continue;
        await new Promise((res) => {
          const fin = () => { clearTimeout(to); res(); };
          const to = setTimeout(fin, 4000);
          el.addEventListener("seeked", fin, { once: true });
          el.currentTime = want;
        });
      }
    }

    async exportarCuadros(cfg, progreso) {
      const { total } = this.linea();
      if (!total) throw new Error("Agrega clips, imágenes o voz primero.");
      const fps = cfg.fps, N = Math.ceil(total * fps);
      this.detener(true);
      this.items.forEach((it) => it.tipo === "video" && it.el.pause());
      progreso && progreso(0, "audio");
      const mezcla = await this.mezclarAudio(total);
      const aud = await this.codificarAudio(mezcla, cfg.audio);

      const vchunks = [];
      let vdesc = null, err = null;
      const venc = new VideoEncoder({
        output: (c, meta) => {
          if (meta && meta.decoderConfig && meta.decoderConfig.description && !vdesc) vdesc = new Uint8Array(meta.decoderConfig.description);
          const d = new Uint8Array(c.byteLength);
          c.copyTo(d);
          vchunks.push({ data: d, ts: c.timestamp, dur: c.duration || Math.round(1e6 / fps), key: c.type === "key" });
        },
        error: (e) => (err = e),
      });
      venc.configure(cfg.video);
      this.exacto = true;
      try {
        for (let i = 0; i < N; i++) {
          if (this.cancelarExport) throw new Error("Exportación cancelada.");
          const t = Math.min(i / fps, total - 0.0005);
          await this.prepararCuadro(t);
          this.dibujar(t);
          const frame = new VideoFrame(this.cv, { timestamp: Math.round((i * 1e6) / fps), duration: Math.round(1e6 / fps) });
          venc.encode(frame, { keyFrame: i % (fps * 2) === 0 });
          frame.close();
          if (err) throw err;
          while (venc.encodeQueueSize > 6) await new Promise((r) => setTimeout(r, 5));
          if (i % 10 === 0) {
            progreso && progreso(i / N, "video");
            await new Promise((r) => setTimeout(r, 0));
          }
        }
        await venc.flush();
      } finally {
        this.exacto = false;
        try { venc.close(); } catch (e) { /* */ }
      }
      if (err) throw err;
      if (cfg.vtipo === "avc" && !vdesc) throw new Error("El codificador no entregó la configuración H.264.");
      const blob = VS.mp4.mux(
        { codec: cfg.vtipo, width: this.cv.width, height: this.cv.height, description: vdesc, chunks: vchunks },
        { codec: cfg.atipo, sampleRate: 48000, channels: 2, bitrate: 160000, description: aud.desc, chunks: aud.chunks },
      );
      progreso && progreso(1, "listo");
      this.dibujar(0);
      return { blob, ext: "mp4", modo: cfg.vtipo === "avc" && cfg.atipo === "aac" ? "mp4" : "mp4-vp9" };
    }

    async exportar(progreso) {
      this.cancelarExport = false;
      const cfg = await Ensamblador.codecs(this.cv.width, this.cv.height, Math.round(8e6 * this.escala));
      if (cfg) return this.exportarCuadros(cfg, progreso);
      return this.exportarTiempoReal();
    }

    async exportarTiempoReal() {
      if (!window.MediaRecorder || !this.cv.captureStream) throw new Error("Tu navegador no permite exportar video. Usa Chrome o Edge en computador.");
      const mime = Ensamblador.tipoGrabacion();
      this.conectarAudio();
      const stream = this.cv.captureStream(30);
      this.dest.stream.getAudioTracks().forEach((t) => stream.addTrack(t));
      const rec = new MediaRecorder(stream, { mimeType: mime || undefined, videoBitsPerSecond: Math.round(8e6 * this.escala), audioBitsPerSecond: 160000 });
      const partes = [];

/* Mezclador para radio: voz + cama musical con entrada, bajada bajo la voz y salida.
   Entrega un WAV estéreo 44.1 kHz normalizado, listo para emisora. */
window.VS = window.VS || {};
(function (VS) {
  "use strict";
  const RATE = 44100;

  async function decodificar(blob) {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    try {
      return await ac.decodeAudioData(await blob.arrayBuffer());
    } finally {
      ac.close && ac.close();
    }
  }

  function aWav(buffer) {
    const ch = buffer.numberOfChannels, n = buffer.length;
    const datos = [];
    for (let c = 0; c < ch; c++) datos.push(buffer.getChannelData(c));
    // normalizar a -1 dBFS
    let pico = 0;
    datos.forEach((d) => { for (let i = 0; i < n; i++) { const a = Math.abs(d[i]); if (a > pico) pico = a; } });
    const g = pico > 0 ? 0.891 / pico : 1;
    const bytes = n * ch * 2;
    const out = new DataView(new ArrayBuffer(44 + bytes));
    const w = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
    w(0, "RIFF"); out.setUint32(4, 36 + bytes, true); w(8, "WAVE"); w(12, "fmt ");
    out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, ch, true);
    out.setUint32(24, buffer.sampleRate, true); out.setUint32(28, buffer.sampleRate * ch * 2, true);
    out.setUint16(32, ch * 2, true); out.setUint16(34, 16, true); w(36, "data"); out.setUint32(40, bytes, true);
    let o = 44;
    for (let i = 0; i < n; i++) {
      for (let c = 0; c < ch; c++) {
        const v = Math.max(-1, Math.min(1, datos[c][i] * g));
        out.setInt16(o, v < 0 ? v * 0x8000 : v * 0x7fff, true);
        o += 2;
      }
    }
    return new Blob([out], { type: "audio/wav" });
  }

  async function mezclar(op) {
    const voz = await decodificar(op.voz);
    const mus = op.musica ? await decodificar(op.musica) : null;
    const intro = mus ? Number(op.intro) || 0 : 0.3;
    const outro = mus ? Number(op.outro) || 0 : 0.5;
    const largo = intro + voz.duration + outro;
    const ctx = new OfflineAudioContext(2, Math.ceil(largo * RATE), RATE);

    const sv = ctx.createBufferSource();
    sv.buffer = voz;
    const gv = ctx.createGain();
    gv.gain.value = Number(op.volVoz) || 1;
    sv.connect(gv).connect(ctx.destination);
    sv.start(intro);

    if (mus) {
      const sm = ctx.createBufferSource();
      sm.buffer = mus;
      sm.loop = true;
      const gm = ctx.createGain();
      const alto = Number(op.volAlto) || 0.8;
      const bajo = Number(op.volBajo) || 0.22;
      const finVoz = intro + voz.duration;
      const p = gm.gain;
      p.setValueAtTime(0, 0);
      p.linearRampToValueAtTime(alto, Math.min(0.4, intro || 0.4));

      p.setValueAtTime(alto, Math.max(finVoz + 0.6, largo - 1.2));
      p.linearRampToValueAtTime(0, largo);
      sm.connect(gm).connect(ctx.destination);
      sm.start(0);
    }
    const render = await ctx.startRendering();
    return { blob: aWav(render), duracion: largo };

        if (out.length > 180000) out = cv.toDataURL("image/webp", 0.9);
        res(out);
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("No se pudo leer esa imagen.")); };
      img.src = url;
    });
  }

  function render() {

  }

  /* =========================================================
     ESTUDIO DE GUIONES

  let actual = null;

  function vEstudio(id) {

    const b = S.brand(p.marcaId);
    const s = S.state.settings;

    view.innerHTML = `
      <div class="page-head">
        <div><span class="eyebrow">Generador de guiones y prompts</span><h1>${p.id ? esc(p.titulo || "Proyecto") : "Nuevo proyecto"}</h1></div>

              <div class="checks">${E.plataformasVideo.concat(["WhatsApp", "Emisora"]).map((pl) => `<label class="check"><input type="checkbox" data-plat="${pl}" ${(p.plataformas || []).includes(pl) ? "checked" : ""}> ${pl}</label>`).join("")}</div>

  function pintarPlan() {
    const p = actual;
    const pl = E.plan(p);
    const T = E.TIPOS[p.tipo];
    $("#plan").innerHTML = T.video
      ? `🎯 <b>Plan:</b> ${pl.escenas} clips (${resumenClips(pl.clips)}) = <b>${pl.dur} s</b>. Locución de ~<b>${pl.palabras}</b> palabras a ${pl.wps} palabras/seg.`
      : `🎯 <b>Plan:</b> ${T.label} de <b>${pl.dur} s</b> · ~<b>${pl.palabras}</b> palabras ${p.tipo === "jingle" ? "cantadas" : "habladas"}.`;
  }
  function resumenClips(c) {
    const m = {};
    c.forEach((x) => (m[x] = (m[x] || 0) + 1));
    return Object.entries(m).map(([d, n]) => `${n} de ${d} s`).join(" + ");
  }

  function persistir() {
    const p = actual;
    if (p.id) S.upsertProject(p);
  }

  function eventosEstudio() {
    const p = actual;
    $("#pSel").addEventListener("change", (e) => {
      if (e.target.value === "__nuevo") ir("#/estudio/nuevo");
      else ir("#/estudio/" + e.target.value);
    });
    $$("[data-tipo]").forEach((btn) => btn.addEventListener("click", () => {
      if (p.tipo === btn.dataset.tipo) return;
      if (p.resultado && !confirm("Cambiar el tipo borra el guion actual de este proyecto. ¿Continuar?")) return;
      const T = E.TIPOS[btn.dataset.tipo];
      p.tipo = btn.dataset.tipo;
      p.duracion = p.tipo === "largo" ? T.duraciones[0] : T.duraciones[1];
      p.formato = T.video ? T.formato : "audio";
      p.resultado = null;
      persistir();
      vEstudio();
    }));
    const campo = (sel, key, num, rerender) => {
      const el = $(sel);
      if (!el) return;
      el.addEventListener(el.tagName === "SELECT" ? "change" : "input", () => {
        p[key] = num ? Number(el.value) : el.value;
        pintarPlan();
        persistir();
        if (rerender) rerender();
      });
    };
    campo("#fDur", "duracion", true);
    campo("#fClip", "clip", true);
    campo("#fFormato", "formato");
    campo("#fAudioVeo", "audioVeo");
    campo("#fIdioma", "idioma");
    campo("#fAtm", "atmosfera");
    campo("#fTema", "tema");
    campo("#fCta", "cta");
    campo("#fFecha", "fecha");
    $("#fMarca").addEventListener("change", (e) => {
      p.marcaId = e.target.value;
      const b = S.brand(p.marcaId);
      if (b && b.idioma) { p.idioma = b.idioma; const i = $("#fIdioma"); if (i) i.value = b.idioma; }
      $("#fCta").placeholder = b ? b.cta || "" : "";
      persistir();
    });
    $("#fEstado").addEventListener("change", (e) => { p.estado = e.target.value; persistir(); });
    $$("[data-plat]").forEach((c) => c.addEventListener("change", () => {
      p.plataformas = $$("[data-plat]").filter((x) => x.checked).map((x) => x.dataset.plat);
      persistir();
    }));

    $("#bGen").addEventListener("click", async (e) => {
      if (!S.state.settings.apiKey) {
        toast("Agrega tu API key en Ajustes, o usa “Copiar prompt maestro” y pégalo en Gemini.", "error");
        return;
      }
      const btn = e.currentTarget;
      cargando(btn, true, "Escribiendo guion y prompts…");
      try {
        const t = await G.texto(E.promptMaestro(p, S.brand(p.marcaId)), true);
        aplicar(E.parse(t));
        toast("Guion generado ✓", "ok");
      } catch (err) {
        toast(err.message, "error");
      } finally {
        cargando(btn, false);
      }
    });
    $("#bPrompt").addEventListener("click", async () => {
      await copiar(E.promptMaestro(p, S.brand(p.marcaId)), modoPro() ? "Prompt copiado. En Gemini pega con Ctrl + V, y al terminar copia toda la respuesta." : "Prompt copiado. Pégalo en Gemini y luego usa “Pegar respuesta”.");
      if (modoPro()) abrirEn(LINKS.gemini);
    });
    $("#bPegar").addEventListener("click", () => pegarRespuesta("Pegar respuesta de Gemini", (t) => {
      aplicar(E.parse(t));
      toast("Guion importado ✓", "ok");
    }));
    $("#bBorr").addEventListener("click", () => {
      if (p.resultado && !confirm("¿Reemplazar el guion actual por un borrador rápido?")) return;
      aplicar(E.borrador(p, S.brand(p.marcaId)));
      toast("Borrador creado. Edítalo a tu gusto.", "ok");
    });
    $("#bGuardar").addEventListener("click", () => {
      if (!p.titulo) p.titulo = (p.tema || E.TIPOS[p.tipo].label).slice(0, 60);
      const nuevo = !p.id;
      S.upsertProject(p);
      toast("Proyecto guardado ✓", "ok");
      if (nuevo) ir("#/estudio/" + p.id);
    });
    const dup = $("#bDup");
    if (dup) dup.addEventListener("click", () => {
      const c = JSON.parse(JSON.stringify(p));
      c.id = null;
      c.titulo = (p.titulo || "Proyecto") + " (copia)";
      c.estado = c.resultado ? "guion" : "idea";
      c.fecha = "";
      delete c.vozActiva;
      S.upsertProject(c);
      toast("Proyecto duplicado ✓", "ok");
      ir("#/estudio/" + c.id);
    });
    const del = $("#bDel");
    if (del) del.addEventListener("click", () => {
      if (!confirm(`¿Eliminar “${p.titulo}”? También se borran sus tomas de voz.`)) return;
      S.deleteProject(p.id);
      actual = null;
      toast("Proyecto eliminado");
      ir("#/panel");
    });
  }

  function aplicar(r) {
    const p = actual;
    p.resultado = r;
    p.titulo = r.titulo || p.titulo || "Sin título";
    if (p.estado === "idea") p.estado = "guion";
    const nuevo = !p.id;
    S.upsertProject(p);
    if (nuevo) ir("#/estudio/" + p.id);
    else vEstudio(p.id);
  }

  /* ---------- Resultado ---------- */
  function areaCopia(path, valor, filas, cls) {
    return `<div class="copy-wrap"><textarea data-k="${path}" rows="${filas || 3}" class="${cls || ""}">${esc(valor)}</textarea><button class="btn btn-ghost btn-sm" data-copy="${path}">Copiar</button></div>`;
  }

  function pintarResultado() {
    const p = actual;
    const r = p.resultado;
    const el = $("#res");
    if (!r) {
      el.innerHTML = `
        <div class="card empty">
          <div class="big">${E.TIPOS[p.tipo].icono}</div>
          <h2>Configura y genera tu ${E.TIPOS[p.tipo].label.toLowerCase()}</h2>
          <p>El estudio arma el guion por escenas, los prompts para Veo 3 en Flow, la dirección de voz y el kit para redes.</p>
          <div class="modes">
            <div class="mode"><b>✨ Con API</b><p class="muted">Un clic. Necesitas tu API key de Gemini en Ajustes.</p></div>
            <div class="mode"><b>📋 Copiar y pegar</b><p class="muted">Copia el prompt maestro, pégalo en Gemini y trae la respuesta. Gratis con tu cuenta.</p></div>

          </div>
        </div>`;
      return;
    }
    const b = S.brand(p.marcaId);
    const T = E.TIPOS[p.tipo];

    const total = E.contar(E.textoHablado(r, p.tipo));
    const seg = Math.round(total / pl.wps);
    let h = `
      <div class="card hero-result">
        <div class="chips">
          <span class="chip chip-gold">${T.icono} ${T.label}</span>
          <span class="chip">${durTxt(p.duracion)}${T.video ? " · " + p.formato : ""}</span>
          ${b ? `<span class="chip chip-pink">${esc(b.nombre)}</span>` : ""}
          ${b && b.voz ? `<span class="chip chip-violet">🎙️ ${esc(b.voz.voice || "")}${b.voz.arquetipo ? " · " + esc(b.voz.arquetipo) : ""}</span>` : ""}
          <span class="chip ${seg > pl.dur * 1.1 ? "chip-red" : "chip-green"}" id="cTotal">${total} palabras · ~${seg} s</span>
        </div>
        <input type="text" class="title-input" data-k="titulo" value="${esc(r.titulo)}" style="margin-top:10px">
        ${r.gancho ? `<p class="hook">Gancho: ${esc(r.gancho)}</p>` : ""}
        <div class="btn-row" style="margin-top:10px">
          ${T.video
            ? `<button class="btn btn-green btn-sm" data-act="veoAll">Copiar todos los prompts Veo</button><a class="btn btn-gold btn-sm" href="${LINKS.flow}" target="_blank" rel="noopener">Abrir Flow ↗</a><button class="btn btn-ghost btn-sm" data-act="imgAll">🖼️ Copiar prompts de imagen y abrir Gemini</button>`
            : `<button class="btn btn-green btn-sm" data-copy="prompt_musica">Copiar prompt de música</button>`}
          <button class="btn btn-ghost btn-sm" data-act="ficha">Descargar ficha</button>
          ${T.video ? `<button class="btn btn-ghost btn-sm" data-act="srt">Subtítulos .srt</button>` : ""}
          <a class="btn btn-violet btn-sm" href="#/voz/${p.id}">🎙️ Crear voz</a>
          ${T.video ? `<button class="btn btn-violet btn-sm" data-act="crearAqui">✨ Crear video aquí</button><a class="btn btn-ghost btn-sm" href="#/ensamblador/${p.id}">🎬 Ensamblar con mis clips</a>` : ""}
        </div>
      </div>`;

    if (r.ancla_visual) {
      h += `<div class="card"><div class="card-head"><span class="card-title">🎨 Ancla visual (coherencia entre clips)</span></div>${areaCopia("ancla_visual", r.ancla_visual, 2)}</div>`;
    }

    if (T.video) {
      r.escenas.forEach((e, i) => {
        const pal = E.contar(e.locucion);
        const max = pl.porEscena[i] || Math.round(e.duracion * pl.wps);
        h += `
        <div class="card scene">
          <div class="scene-head">
            <span class="scene-n">🎬 Escena ${e.n}</span>
            <span class="chip chip-green">Veo 3 · clip de ${e.duracion} s</span>
            <span class="chip ${pal > max ? "chip-red" : ""}" id="wc-${i}">${pal}/${max} palabras</span>
            <span class="muted small" style="margin-left:auto">${esc(e.visual)}</span>
          </div>
          <label class="field"><span>Locución</span><textarea data-k="escenas.${i}.locucion" data-wc="${i}" rows="2">${esc(e.locucion)}</textarea></label>
          <label class="field"><span>Texto en pantalla</span><input type="text" data-k="escenas.${i}.texto_pantalla" value="${esc(e.texto_pantalla)}"></label>
          <div class="field"><span>Prompt para Veo 3 (Flow)</span>${areaCopia(`escenas.${i}.prompt_veo`, e.prompt_veo, 4, "code")}</div>

          </div>
          ${r.estructura.map((e, i) => `

        <label class="field"><span>Estilo de interpretación</span><input type="text" data-k="voz.estilo" value="${esc(r.voz.estilo)}"></label>

        <label class="field"><span>Descripción</span>${areaCopia("kit.descripcion", r.kit.descripcion, 3)}</label>
        <label class="field"><span>Hashtags</span>${areaCopia("kit.hashtags", (r.kit.hashtags || []).join(" "), 2)}</label>

  function eventosResultado() {
    const p = actual;
    const r = p.resultado;
    const el = $("#res");
    el.addEventListener("input", (e) => {
      const k = e.target.dataset.k;
      if (!k) return;
      let v = e.target.value;
      if (k === "kit.hashtags") v = v.split(/\s+/).filter(Boolean);
      setPath(r, k, v);
      if (k === "titulo") p.titulo = v;
      if (e.target.dataset.wc) {
        const i = Number(e.target.dataset.wc);
        const pl = E.plan(p);
        const max = pl.porEscena[i] || 0;
        const n = E.contar(v);
        const c = $("#wc-" + i);
        c.textContent = `${n}/${max} palabras`;
        c.classList.toggle("chip-red", n > max);
      }
      p.actualizado = Date.now();
      guardarLuego();
    });
    el.addEventListener("click", (e) => {
      const c = e.target.closest("[data-copy]");
      if (c) {
        const v = getPath(r, c.dataset.copy);
        copiar(Array.isArray(v) ? v.join(" ") : String(v || ""));
        return;
      }
      const a = e.target.closest("[data-act]");
      if (!a) return;
      const b = S.brand(p.marcaId);
      switch (a.dataset.act) {
        case "veoAll": copiar(E.prompsVeoTexto(r), `${r.escenas.length} prompts copiados ✓`); break;
        case "imgAll": {
          const fmt = p.formato === "16:9" ? "horizontal 16:9" : p.formato === "1:1" ? "cuadrada 1:1" : p.formato === "4:5" ? "vertical 4:5" : "vertical 9:16";
          const txt = `Crea ${r.escenas.length} imágenes, una por escena, en formato ${fmt}, sin texto, letras ni logos. Mantén el mismo personaje, paleta y estilo en todas.${r.ancla_visual ? "\nEstilo fijo: " + r.ancla_visual : ""}\n\n` +
            r.escenas.map((e) => `ESCENA ${e.n}: ${e.prompt_imagen || e.visual}`).join("\n\n");
          copiar(txt, "Prompts de imagen copiados. Pégalos en Gemini, descarga las imágenes y arrástralas a Ensamblar.").then(() => abrirEn(LINKS.gemini));
          break;
        }
        case "ficha": descargar(`${slug(r.titulo)}-ficha.txt`, E.ficha(p, b)); break;
        case "srt": descargar(`${slug(r.titulo)}.srt`, E.srtEscenas(r)); break;
        case "kit": copiar(E.kitTexto(r) + (r.kit.comentario_fijado ? `\n\nComentario fijado: ${r.kit.comentario_fijado}` : ""), "Kit copiado ✓"); break;
        case "crearAqui": asm().autoIA = p.id; ir("#/ensamblador/" + p.id); break;
        case "tts": copiar(`Style: ${r.voz.estilo || ""}\nVoice: ${(b && b.voz && b.voz.voice) || "Kore"}\n\n${E.textoHablado(r, p.tipo)}`, "Directiva de voz copiada ✓"); break;
      }
    });
  }

  /* =========================================================
     VOZ
     ========================================================= */
  async function vVoz(id) {
    const p = (id && S.project(id)) || (actual && actual.id ? actual : null) || S.state.projects[0] || null;
    const b = p ? S.brand(p.marcaId) : null;
    const cfg = (p && p.vozConfig) || {};
    let voice = cfg.voice || (b && b.voz && b.voz.voice) || "Kore";
    const estilo = cfg.estilo || (p && p.resultado && p.resultado.voz.estilo) || (b && b.voz && b.voz.estilo) || "";
    const texto = (p && p.vozTexto) || (p && p.resultado ? E.textoHablado(p.resultado, p.tipo) : "");
    const wps = S.state.settings.wps;

    view.innerHTML = `
      <div class="page-head">
        <div><span class="eyebrow">Constructor de voces</span><h1>Voz y locución</h1><p>Genera la voz con Gemini, guarda tus tomas y úsalas en el ensamblador.</p></div>
        <div class="btn-row">${selectorProyecto(p && p.id, false)}</div>
      </div>
      <div class="grid-2">
        <div class="sticky">
          <div class="card">
            <div class="card-head"><span class="card-title">Texto a locutar</span><span class="chip" id="vCount"></span></div>
            <textarea id="vTexto" rows="9" placeholder="Escribe o genera un guion en la sección Guiones.">${esc(texto)}</textarea>
            <p class="small muted" style="margin-top:6px">Escribe EN MAYÚSCULAS para enfatizar. Pausas: <span class="mono">&lt;short pause&gt;</span> · Risa: <span class="mono">&lt;laugh&gt;</span></p>
            ${p && p.vozTexto ? `<button class="btn btn-ghost btn-sm" id="vReset" style="margin-top:8px">Volver al texto del guion</button>` : ""}
          </div>
          <div class="card">
            <div class="card-head"><span class="card-title">Voz</span><span class="chip chip-violet" id="vSel">${esc(voice)}</span></div>
            <div class="voices">${G.VOCES.map(([n, d]) => `<button type="button" class="voice ${n === voice ? "on" : ""}" data-voice="${n}"><b>${n}</b><small>${d}</small></button>`).join("")}</div>
            <label class="field" style="margin-top:12px"><span>Estilo de interpretación (corto, en inglés)</span>
              <input type="text" id="vEstilo" value="${esc(estilo)}" placeholder="Ej: Warm, confident, smiling radio delivery"></label>
            <div class="btn-stack">
              <button class="btn btn-violet btn-block" id="vGen" ${p ? "" : "disabled"}>🎙️ Generar voz con Gemini</button>
              <div class="row">
                <button class="btn btn-ghost btn-sm" id="vNav">▶ Escuchar borrador</button>
                <button class="btn btn-ghost btn-sm" id="vStudio" title="Usa tu suscripción Pro en AI Studio">📋 Copiar y abrir AI Studio</button>
                <label class="btn btn-ghost btn-sm" style="cursor:pointer">⬆ Subir audio propio<input type="file" id="vUp" accept="audio/*" hidden></label>
              </div>
            </div>
            ${p ? "" : `<p class="note warn" style="margin-top:12px">Crea o elige un proyecto para guardar las tomas.</p>`}
          </div>
        </div>
        <div>
          <div class="card">
            <div class="card-head"><span class="card-title">Tomas guardadas</span><span class="muted small">La marcada en verde se usa en el ensamblador</span></div>
            <div class="list" id="tomas"><p class="muted small">Cargando…</p></div>
          </div>
          ${p && p.tipo === "jingle" && p.resultado && p.resultado.prompt_musica ? `
          <div class="card">
            <div class="card-head"><span class="card-title">🎼 Jingle cantado</span><button class="btn btn-green btn-sm" id="vMus">Copiar prompt de música</button></div>
            <p class="muted small">La voz de Gemini habla, no canta. Para la versión cantada, pega el prompt de música en tu generador musical y sube aquí el resultado con “Subir audio propio”.</p>
          </div>` : ""}
        </div>
      </div>`;

    const cuenta = () => {
      const n = E.contar($("#vTexto").value);
      $("#vCount").textContent = `${n} palabras · ~${Math.round(n / wps)} s`;
    };
    cuenta();
    $("#pSel").addEventListener("change", (e) => e.target.value && ir("#/voz/" + e.target.value));
    $("#vTexto").addEventListener("input", () => {
      cuenta();
      if (p) { p.vozTexto = $("#vTexto").value; guardarLuego(p); }
    });
    const rs = $("#vReset");
    if (rs) rs.addEventListener("click", () => { delete p.vozTexto; S.tocar(p); vVoz(p.id); });
    $$("[data-voice]").forEach((v) => v.addEventListener("click", () => {
      voice = v.dataset.voice;
      $$("[data-voice]").forEach((x) => x.classList.toggle("on", x === v));
      $("#vSel").textContent = voice;
      if (p) { p.vozConfig = { voice, estilo: $("#vEstilo").value }; S.tocar(p); }
    }));
    $("#vEstilo").addEventListener("input", () => { if (p) { p.vozConfig = { voice, estilo: $("#vEstilo").value }; guardarLuego(p); } });

      abrirEn(LINKS.aistudio);
    });
    $("#vNav").addEventListener("click", () => {
      const t = $("#vTexto").value.replace(/<[^>]+>/g, " ");
      if (!t.trim()) return toast("No hay texto para escuchar.");
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(t);
      const idi = ((p && p.idioma) || "español").toLowerCase();
      u.lang = idi.startsWith("ingl") || idi.startsWith("en") ? "en-US" : idi.startsWith("portu") ? "pt-BR" : "es-CO";
      speechSynthesis.speak(u);
      toast("Borrador con la voz del navegador (solo para revisar ritmo).");
    });

    $("#vGen").addEventListener("click", async (e) => {
      const t = $("#vTexto").value.trim();
      if (!t) return toast("Escribe el texto a locutar.", "error");
      if (!S.state.settings.apiKey) return toast("Agrega tu API key de Gemini en Ajustes.", "error");
      const btn = e.currentTarget;
      cargando(btn, true, "Generando voz…");
      try {
        const blob = await G.voz(t, voice, $("#vEstilo").value.trim());
        await guardarToma(p, blob, { voice, estilo: $("#vEstilo").value.trim(), origen: "Gemini" });
        toast("Toma de voz lista ✓", "ok");
      } catch (err) {
        toast(err.message, "error");
      } finally {
        cargando(btn, false);
      }
    });
    $("#vUp").addEventListener("change", async (e) => {
      const f = e.target.files[0];
      if (!f || !p) return;
      await guardarToma(p, f, { voice: f.name, estilo: "Archivo propio", origen: "Subido" });
      toast("Audio agregado ✓", "ok");
    });

    pintarTomas(p);
  }

  async function guardarToma(p, blob, meta) {
    const key = `${p.id}__voz__${Date.now()}`;
    try {
      const r = await VS.media.put(key, Object.assign({ blob, fecha: Date.now() }, meta));
      if (r && r.motivo === "grande") toast("El audio pesa más de 4.5 MB: quedó guardado solo en este equipo. Descárgalo para tenerlo en otros.", "error");
    } catch (e) {
      toast("El audio quedó en este equipo, pero no se pudo subir a la nube: " + e.message, "error");
    }
    p.vozActiva = key;
    if (p.estado === "guion") p.estado = "produccion";
    S.upsertProject(p);
    pintarTomas(p);
  }

  async function pintarTomas(p) {
    const cont = $("#tomas");
    if (!cont) return;
    if (!p) { cont.innerHTML = `<p class="muted small">Sin proyecto.</p>`; return; }
    let keys = [];
    try { keys = (await VS.media.keys(p.id + "__voz__")).sort().reverse(); } catch (e) { /* */ }
    if (!keys.length) { cont.innerHTML = `<p class="muted small">Todavía no hay tomas. Genera la voz o sube un audio.</p>`; return; }
    const items = (await Promise.all(keys.map(async (k) => [k, await VS.media.get(k)]))).filter(([, t]) => t && t.blob);
    cont.innerHTML = items.map(([k, t]) => `
      <div class="take ${p.vozActiva === k ? "on" : ""}">
        <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center">
          <span><b>${esc(t.voice)}</b> <span class="muted small">· ${esc(t.estilo || "")} · ${new Date(t.fecha).toLocaleString("es-CO", { dateStyle: "short", timeStyle: "short" })}</span></span>
          <span class="btn-row">
            ${p.vozActiva === k ? `<span class="chip chip-green">En uso</span>` : `<button class="btn btn-ghost btn-sm" data-usar="${k}">Usar en video</button>`}
            <button class="btn btn-ghost btn-sm" data-radio="${k}">📻 Mezclar para radio</button>
            <button class="btn btn-ghost btn-sm" data-bajar="${k}">Descargar</button>
            <button class="btn btn-red btn-sm" data-borrar="${k}">✕</button>
          </span>
        </div>
        <audio controls preload="metadata" src="${URL.createObjectURL(t.blob)}"></audio>
      </div>`).join("");
    $$("[data-usar]", cont).forEach((b) => b.addEventListener("click", () => { p.vozActiva = b.dataset.usar; S.tocar(p); pintarTomas(p); }));
    $$("[data-bajar]", cont).forEach((b) => b.addEventListener("click", async () => {
      const t = await VS.media.get(b.dataset.bajar);
      const ext = (t.blob.type.split("/")[1] || "wav").replace("mpeg", "mp3").split(";")[0];
      descargar(`${slug(p.titulo)}-voz-${slug(t.voice)}.${ext}`, t.blob);
    }));
    $$("[data-radio]", cont).forEach((b) => b.addEventListener("click", () => mezclarRadio(p, b.dataset.radio)));
    $$("[data-borrar]", cont).forEach((b) => b.addEventListener("click", async () => {
      if (!confirm("¿Borrar esta toma?")) return;
      await VS.media.del(b.dataset.borrar);
      if (p.vozActiva === b.dataset.borrar) { delete p.vozActiva; S.tocar(p); }
      pintarTomas(p);
    }));
  }

  /* ---------- Mezcla para radio ---------- */
  let ultimaCama = null; // la última música elegida se recuerda mientras la app está abierta

  function mezclarRadio(p, key) {
    const m = modal(`
      <div class="card-head"><h2>📻 Mezclar para radio</h2><button class="btn btn-ghost btn-sm" data-close>Cerrar</button></div>
      <p class="muted small" style="margin-bottom:14px">Une esta voz con una cama musical: la música entra, baja mientras se habla y vuelve a subir al final. Sale un WAV estéreo normalizado, listo para emisora.</p>
      <div class="field"><span>Cama musical</span>
        <div class="row" style="grid-template-columns:1fr auto">
          <span class="muted small" id="rNom" style="align-self:center">${ultimaCama ? esc(ultimaCama.name) : "Sin música (solo voz limpia)"}</span>
          <label class="btn btn-ghost btn-sm" style="cursor:pointer">Elegir audio<input type="file" id="rMus" accept="audio/*" hidden></label>
        </div>
      </div>
      <div class="row">
        <label class="field"><span>Entrada musical (s)</span><input type="number" id="rIn" min="0" max="10" step="0.5" value="2"></label>
        <label class="field"><span>Salida musical (s)</span><input type="number" id="rOut" min="0" max="15" step="0.5" value="3"></label>
      </div>
      <div class="vol"><span>Música alta</span><input type="range" id="rAlto" min="0.1" max="1" step="0.05" value="0.8"><span id="rAltoT">80%</span></div>
      <div class="vol"><span>Bajo la voz</span><input type="range" id="rBajo" min="0" max="0.6" step="0.02" value="0.22"><span id="rBajoT">22%</span></div>
      <div class="vol"><span>Voz</span><input type="range" id="rVoz" min="0.5" max="1.5" step="0.05" value="1"><span id="rVozT">100%</span></div>
      <div id="rRes" style="margin-top:12px"></div>
      <div class="btn-row" style="justify-content:flex-end;margin-top:14px"><button class="btn btn-gold" id="rOk">Crear mezcla</button></div>`);
    const q = (s) => $(s, m.el);
    [["#rAlto", "#rAltoT"], ["#rBajo", "#rBajoT"], ["#rVoz", "#rVozT"]].forEach(([a, b]) =>
      q(a).addEventListener("input", () => (q(b).textContent = Math.round(q(a).value * 100) + "%")));
    q("#rMus").addEventListener("change", (e) => {
      if (e.target.files[0]) { ultimaCama = e.target.files[0]; q("#rNom").textContent = ultimaCama.name; }
    });
    q("#rOk").addEventListener("click", async (e) => {
      const btn = e.currentTarget;
      cargando(btn, true, "Mezclando…");
      try {
        const t = await VS.media.get(key);
        const { blob, duracion } = await VS.radio.mezclar({
          voz: t.blob, musica: ultimaCama, intro: q("#rIn").value, outro: q("#rOut").value,
          volAlto: q("#rAlto").value, volBajo: q("#rBajo").value, volVoz: q("#rVoz").value,
        });
        await guardarToma(p, blob, { voice: "Mezcla radio", estilo: `${t.voice}${ultimaCama ? " + " + ultimaCama.name : ""}`, origen: "Mezcla" });
        q("#rRes").innerHTML = `<p class="note">Mezcla lista (${fmtSeg(duracion)}). Quedó guardada en las tomas.</p><audio controls style="width:100%;margin-top:8px" src="${URL.createObjectURL(blob)}"></audio>`;
        btn.outerHTML = `<button class="btn btn-green" id="rDl">Descargar WAV</button>`;
        q("#rDl").addEventListener("click", () => descargar(`${slug(p.titulo)}-radio.wav`, blob));
        toast("Mezcla para radio lista ✓", "ok");
      } catch (err) {
        toast("No se pudo mezclar: " + err.message, "error");
        cargando(btn, false);
      }
    });
  }

  /* =========================================================
     ENSAMBLADOR
     ========================================================= */
  function asm() {
    if (!VS.asm) {
      const cv = document.createElement("canvas");
      VS.asm = { cv, inst: new VS.Ensamblador(cv), proyectoId: null, subsOn: true, porGrupo: 4, texto: "", vozKey: null };
    }
    return VS.asm;
  }

  function rehacerSubs() {
    const A = asm(), inst = A.inst;
    const dur = inst.duracionVoz() || inst.linea().total;
    inst.subs = A.subsOn && A.texto ? E.subtitulos(A.texto.replace(/<[^>]+>/g, " "), dur, A.porGrupo) : [];
    inst.dibujar(0);
    const info = $("#aInfo");
    if (info) {
      const { total } = inst.linea();
      info.textContent = total ? `Duración: ${fmtSeg(total)} · ${inst.items.length} elementos${inst.voz ? " · con voz" : ""}` : "Sin contenido aún";
    }
  }

  async function cargarProyectoEnAsm(p) {
    const A = asm(), inst = A.inst;
    A.proyectoId = p ? p.id : null;
    if (!p) return;
    const b = S.brand(p.marcaId);
    A.texto = p.resultado ? E.textoHablado(p.resultado, p.tipo) : "";
    inst.marca = b ? b.nombre : "";
    if (E.TIPOS[p.tipo].video && VS.FORMATOS[p.formato]) inst.setFormato(p.formato);
    A.vozKey = null;
    await inst.setAudio("voz", null);
    if (p.vozActiva) {
      try {
        const t = await VS.media.get(p.vozActiva);
        if (t) { await inst.setAudio("voz", t.blob); A.vozKey = p.vozActiva; }
      } catch (e) { /* */ }
    }
    if (!inst.items.length) await cargarEscenasIA(p, "clip");
  }

  // Carga en orden las imágenes o clips creados con IA para cada escena (prefiere el tipo indicado)
  async function cargarEscenasIA(p, prefiere) {
    const inst = asm().inst;
    const pre = p.id + "__esc__";
    let keys = [];
    try { keys = await VS.media.keys(pre); } catch (e) { return 0; }
    if (!keys.length) return 0;
    const porEsc = {};
    keys.forEach((k) => {
      const m = /^(\d+)__(img|clip)$/.exec(k.slice(pre.length));
      if (m) (porEsc[m[1]] = porEsc[m[1]] || {})[m[2]] = k;
    });
    const otro = prefiere === "clip" ? "img" : "clip";
    inst.items.forEach((it) => URL.revokeObjectURL(it.url));
    inst.items = [];
    let n = 0;
    for (const esc_ of Object.keys(porEsc).sort()) {
      const k = porEsc[esc_][prefiere] || porEsc[esc_][otro];
      const t = await VS.media.get(k);
      if (!t || !t.blob) continue;
      const esClip = k.endsWith("__clip");
      await inst.agregarArchivo(new File([t.blob], `escena-${esc_}${esClip ? ".mp4" : ".jpg"}`, { type: t.blob.type || (esClip ? "video/mp4" : "image/jpeg") }));
      n++;
    }
    if (n && !inst.items.some((it) => it.tipo === "video")) inst.movimiento = true;
    return n;
  }

            blob = await reintento(() => G.imagen(prompt, inst.formato), chip);
          } else {
            let base = null;
            if (usarBase) { const tb = await VS.media.get(`${p.id}__esc__${n}__img`); base = tb && tb.blob; }
            blob = await reintento(() => G.videoClip(e.prompt_veo || e.visual || e.locucion, inst.formato, base), chip);
          }
          await VS.media.put(`${p.id}__esc__${n}__${t}`, { blob, voice: "", estilo: "", origen: "IA", fecha: Date.now() });
          chip.className = "chip chip-green";
          chip.textContent = "Listo ✓";
          ok++;
        } catch (err) {
          chip.className = "chip chip-red";
          chip.textContent = "Error";
          chip.title = err.message;
          toast(`Escena ${e.n}: ${err.message}`, "error");
        }
      }
      q("#iaStop").disabled = true;
      cargando(btn, false);
      if (!ok) return;
      if (q("#iaRep").checked) {
        await cargarEscenasIA(p, t);
      } else {
        for (const i of elegidas) {
          const n = String(i + 1).padStart(2, "0");
          const tt = await VS.media.get(`${p.id}__esc__${n}__${t}`);
          if (tt && tt.blob) await inst.agregarArchivo(new File([tt.blob], `escena-${n}${t === "clip" ? ".mp4" : ".jpg"}`, { type: tt.blob.type }));
        }
      }
      if (t === "img") inst.movimiento = true;
      if (p.estado === "guion") { p.estado = "produccion"; S.upsertProject(p); }
      toast(`${ok} ${t === "img" ? "imágenes" : "clips"} listos en el ensamblador ✓`, "ok");
      m.cerrar();
      vEns(p.id);
    });
  }

  let buscaEmpresa = "";

    view.innerHTML = `
      <div class="page-head">
        <div><span class="eyebrow">Empresas que asesoras</span><h1>Empresas y voces</h1><p>Sin límite: cada empresa con sus productos, su estética y su voz. Todo guion sale con su identidad.</p></div>
        <div class="btn-row">
          ${B.length > 4 ? `<input type="text" id="bBusca" placeholder="Buscar empresa…" value="${esc(buscaEmpresa)}" style="width:200px">` : ""}
          <button class="btn btn-gold" id="bNueva">＋ Nueva empresa</button>

        <div class="card bcard" style="--c:${esc(b.color || "#f5a524")}">

            <span class="chip chip-green">${cuenta(b, (p) => p.estado === "listo" || p.estado === "publicado")} listas</span>
          </div>

            <a class="btn btn-gold btn-sm" href="#/auto/${b.id}">⚡ Producir</a>

      : B.length ? `<p class="muted">Ninguna empresa coincide con “${esc(buscaEmpresa)}”.</p>`
      : `<div class="card empty"><div class="big">🏷️</div><h2>Crea tu primera empresa</h2><p>Define nicho, productos, estética y voz una vez, y todos los guiones saldrán coherentes.</p></div>`}`;

    $$("[data-ver]").forEach((c) => c.addEventListener("click", () => { filtroEmpresa = c.dataset.ver; ir("#/panel"); }));
    $$("[data-zip]").forEach((c) => c.addEventListener("click", () => paqueteEmpresa(S.brand(c.dataset.zip), c)));

      vAjustes();

    if (sy) sy.addEventListener("click", async () => { await S.sincronizar(); toast("Sincronizado ✓", "ok"); });
    $("#sSave").addEventListener("click", () => { guardar(); toast("Ajustes guardados ✓", "ok"); });
    ["#sWps", "#sClip", "#sLang"].forEach((id) => $(id).addEventListener("change", guardar));
    $("#sTest").addEventListener("click", async (e) => {
      guardar();
      const btn = e.currentTarget;
      cargando(btn, true, "Probando…");
      try {
        const r = await G.probar();
        toast(`Conexión correcta ✓ (${S.state.settings.modelText} respondió: ${r.slice(0, 20)})`, "ok");
      } catch (err) {
        toast(err.message, "error");
      } finally {
        cargando(btn, false);
      }
    });
    const aDataUrl = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
    $("#sExp").addEventListener("click", async (e) => {
      const btn = e.currentTarget;
      cargando(btn, true, "Preparando…");
      try {
        const obj = S.exportJSON();
        let n = 0;
        if ($("#sConAudio").checked) {
          obj.media = [];
          for (const p of S.state.projects) {
            for (const k of await VS.media.keys(p.id + "__voz__")) {
              const t = await VS.media.get(k);
              if (!t || !t.blob) continue;
              obj.media.push({ key: k, voice: t.voice || "", estilo: t.estilo || "", origen: t.origen || "", fecha: t.fecha || Date.now(), data: await aDataUrl(t.blob) });
              n++;
            }
          }
        }
        const nombre = slug(S.state.settings.appName || "vocalis");
        descargar(`${nombre}-respaldo-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(obj), "application/json");
        toast(`Respaldo listo: ${S.state.projects.length} proyectos${n ? ` y ${n} audios` : ""} ✓`, "ok");
      } catch (err) {
        toast("No se pudo exportar: " + err.message, "error");
      } finally {
        cargando(btn, false);
      }
    });
    $("#sImp").addEventListener("change", async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      try {
        const obj = JSON.parse(await f.text());
        const na = Array.isArray(obj.media) ? obj.media.length : 0;
        if (!confirm(`Esto reemplaza lo que hay en este equipo por el respaldo: ${obj.projects.length} proyectos, ${obj.brands.length} empresas${na ? ` y ${na} audios` : ""}. ¿Continuar?`)) return;
        S.importJSON(obj);
        let ok = 0;
        for (const m of obj.media || []) {
          try {
            const blob = await (await fetch(m.data)).blob();
            await VS.media.put(m.key, { blob, voice: m.voice, estilo: m.estilo, origen: m.origen, fecha: m.fecha });
            ok++;
          } catch (err) { /* audio dañado: se omite */ }
        }
        actual = null;
        toast(`Respaldo importado ✓ ${ok ? ok + " audios restaurados." : ""}`, "ok");
        vAjustes();
      } catch (err) {
        toast(err.message || "No se pudo leer el archivo.", "error");
      }
    });
    $("#sReset").addEventListener("click", () => {
      if (!confirm("¿Borrar TODOS los proyectos y empresas? Exporta un respaldo antes si lo necesitas.")) return;
      S.reset();
      actual = null;
      toast("Estudio vacío.");
      vAjustes();
    });
  }

  /* =========================================================
     PRODUCCIÓN AUTOMÁTICA (lotes por empresa)
     ========================================================= */
  const lote = { corriendo: false, cancelar: false, cola: [], sel: null, cfg: null };
  const PLAT = { short: ["TikTok", "Reels", "Shorts"], largo: ["YouTube"], cuna: ["Emisora", "WhatsApp"], jingle: ["Emisora", "WhatsApp"] };
  const ESTADO_COLA = {
    pendiente: ["", "En espera"], temas: ["chip-violet", "Pensando temas"], guion: ["chip-gold", "Escribiendo guion"],
    voz: ["chip-violet", "Generando voz"], radio: ["chip-pink", "Mezclando radio"], listo: ["chip-green", "Listo ✓"],
    error: ["chip-red", "Error"], cancelado: ["", "Cancelado"],
  };
  const espera = (ms) => new Promise((r) => setTimeout(r, ms));

  async function reintentar(fn, it) {
    for (let intento = 1; ; intento++) {
      try {
        return await fn();
      } catch (e) {
        const temporal = !e.status || e.status === 429 || e.status >= 500;
        if (!temporal || intento >= 3 || lote.cancelar) throw e;
        const seg = 20 * intento;
        if (it) { it.msg = `Límite o error temporal. Reintento en ${seg} s…`; pintarCola(); }
        await espera(seg * 1000);
        if (it) it.msg = "";
      }
    }
  }

  function vAuto(preId) {
    const B = S.state.brands;
    const hayKey = !!S.state.settings.apiKey;
    if (preId && S.brand(preId)) lote.sel = [preId];
    const sel = new Set(lote.sel || B.map((b) => b.id));
    const c = lote.cfg || { cant: { short: 3, cuna: 1, jingle: 0, largo: 0 }, dur: { short: 30, cuna: 30, jingle: 30, largo: 180 }, modo: "auto", mios: "", voz: true, radio: false, fechas: false, desde: new Date().toISOString().slice(0, 10), cada: 1 };

    view.innerHTML = `
      <div class="page-head">
        <div><span class="eyebrow">Producción automática</span><h1>Guiones y voces en lote</h1>
          <p>Elige empresas y cantidades. El estudio propone temas, escribe cada guion con el perfil de la empresa y genera las voces.</p></div>
      </div>
      ${B.length ? "" : `<div class="note warn" style="margin-bottom:14px">Primero crea tus empresas en <a href="#/marcas">Empresas</a>.</div>`}
      ${modoPro() ? `<div class="note" style="margin-bottom:14px">Modo Pro: usa la tarjeta <b>⭐ Lote en tu Gemini</b> para crear todos los guiones con tu suscripción. Las voces las creas en AI Studio y las subes en Voz.</div>` : hayKey ? "" : `<div class="note warn" style="margin-bottom:14px">Sin API key de Gemini solo se crean borradores base (sin IA y sin voz). Agrégala en <a href="#/ajustes">Ajustes</a>, o activa el Modo Pro para usar tu suscripción.</div>`}
      <div class="grid-2">
        <div class="sticky">
          <div class="card">
            <div class="card-head"><span class="card-title">1 · Empresas</span><label class="check"><input type="checkbox" id="lTodas" ${sel.size === B.length && B.length ? "checked" : ""}> Todas</label></div>
            <div class="list" style="max-height:220px;overflow:auto">
              ${B.map((b) => `<label class="list-item check" style="cursor:pointer"><span><input type="checkbox" data-emp="${b.id}" ${sel.has(b.id) ? "checked" : ""}> <b>${esc(b.nombre)}</b> <span class="muted small">· ${esc(b.nicho || "")}</span></span><span class="chip chip-violet">🎙️ ${esc((b.voz && b.voz.voice) || "Kore")}</span></label>`).join("")}
            </div>
          </div>
          <div class="card">
            <div class="card-head"><span class="card-title">2 · Qué crear por empresa</span></div>
            ${Object.entries(E.TIPOS).map(([k, t]) => `

                <input type="number" min="0" max="30" value="${c.cant[k]}" data-cant="${k}" aria-label="Cantidad de ${t.label}">
                <select data-dur="${k}">${opciones(t.duraciones.map((d) => [d, durTxt(d)]), c.dur[k])}</select>

              <label class="check"><input type="radio" name="lModo" value="mios" ${c.modo === "mios" || !(hayKey || modoPro()) ? "checked" : ""}> Mis temas</label>
            </div>
            <textarea id="lMios" rows="4" placeholder="Un tema por línea. Se reparten en orden entre las piezas.&#10;Ej: Promo 2x1 del viernes&#10;Lanzamiento del nuevo menú">${esc(c.mios)}</textarea>
          </div>
          <div class="card">
            <div class="card-head"><span class="card-title">4 · Voz, radio y calendario</span></div>

              <label class="check"><input type="checkbox" id="lVoz" ${c.voz && hayKey ? "checked" : ""} ${hayKey ? "" : "disabled"}> Generar la voz de cada pieza con la voz de su empresa</label>
              <label class="check"><input type="checkbox" id="lRadio" ${c.radio ? "checked" : ""} ${hayKey ? "" : "disabled"}> Mezclar cuñas y jingles con cama musical (listos para emisora)</label>
              <div class="row" style="grid-template-columns:1fr auto" id="lCamaRow">
                <span class="muted small" id="lCamaNom" style="align-self:center">${ultimaCama ? esc(ultimaCama.name) : "Elige la cama musical"}</span>
                <label class="btn btn-ghost btn-sm" style="cursor:pointer">Elegir audio<input type="file" id="lCama" accept="audio/*" hidden></label>

                <label class="field"><span>Cada</span><select id="lCada">${opciones([[1, "1 día"], [2, "2 días"], [3, "3 días"], [7, "1 semana"]], c.cada)}</select></label>
