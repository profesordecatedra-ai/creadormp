  <style>
:root {
  --bg: #090d1a;
  --bg-2: #0d1426;
  --panel: #111a2f;
  --panel-2: #16213a;
  --field: #0a1020;
  --line: rgba(255, 255, 255, .08);
  --line-2: rgba(255, 255, 255, .15);
  --text: #eef1f8;
  --muted: #94a0bb;
  --dim: #66728f;
  --gold: #f5a524;
  --gold-2: #ffcf5c;
  --violet: #8b5cf6;
  --violet-2: #c4b5fd;
  --pink: #ec4899;
  --green: #34d399;
  --red: #f87171;
  --blue: #60a5fa;
  --r: 16px;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; font-family: var(--font); color: var(--text); font-size: 15px; line-height: 1.5;
  background: radial-gradient(1000px 600px at 100% -10%, rgba(139, 92, 246, .12), transparent 60%),
              radial-gradient(800px 500px at -10% 20%, rgba(245, 165, 36, .06), transparent 60%), var(--bg);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; letter-spacing: -.015em; }
h1 { font-size: 1.6rem; font-weight: 800; }
h2 { font-size: 1.15rem; font-weight: 800; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: .84rem; }
.mono { font-family: var(--mono); }

/* ---------- Layout ---------- */
.app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; padding: 20px 14px; border-right: 1px solid var(--line);
  background: rgba(9, 13, 26, .8); display: flex; flex-direction: column; gap: 6px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; text-decoration: none; }
.brand-icon { position: relative; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--violet), var(--pink)); flex-shrink: 0; }
.brand-icon.has-logo { background: #fff; overflow: visible; }
.brand-icon img { width: 100%; height: 100%; object-fit: contain; border-radius: inherit; display: block; }
.brand-icon::after { content: ""; position: absolute; right: -2px; bottom: -2px; width: 11px; height: 11px; border-radius: 50%; background: var(--green); border: 2px solid var(--bg); }
.brand b { display: block; font-size: 1.05rem; font-weight: 800; letter-spacing: -.02em; }
.brand small { color: var(--violet-2); font-size: .7rem; font-weight: 700; letter-spacing: .08em; }
.nav-item {
  display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 11px; text-decoration: none;
  color: var(--muted); font-weight: 600; transition: background .15s, color .15s;
}
.nav-item svg { width: 19px; height: 19px; flex-shrink: 0; }
.nav-item:hover { background: rgba(255, 255, 255, .05); color: var(--text); }
.nav-item.active { background: linear-gradient(90deg, rgba(245, 165, 36, .16), rgba(245, 165, 36, .04)); color: var(--gold-2); box-shadow: inset 2px 0 0 var(--gold); }
.side-foot { margin-top: auto; padding: 12px; border-radius: 12px; border: 1px solid var(--line); font-size: .8rem; color: var(--muted); }
.side-foot .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--dim); }
.side-foot .dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); }
.side-foot .dot.warn { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.side-foot .dot.err { background: var(--red); box-shadow: 0 0 8px var(--red); }
input[type="radio"] { accent-color: var(--gold); width: 16px; height: 16px; }

.main { min-width: 0; padding: 26px clamp(16px, 3vw, 36px) 90px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head p { color: var(--muted); margin-top: 4px; }
.eyebrow { font-family: var(--mono); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; display: block; }

/* ---------- Paneles ---------- */
.card { background: linear-gradient(180deg, var(--panel), var(--bg-2)); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.card + .card { margin-top: 14px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-title { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: .76rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-2); }
.grid-2 { display: grid; grid-template-columns: minmax(320px, 400px) 1fr; gap: 18px; align-items: start; }
.grid-2 > * { min-width: 0; }
.sticky { position: sticky; top: 18px; }

/* ---------- Formularios ---------- */
.field { display: grid; gap: 6px; margin-bottom: 13px; }
.field > span, .label { font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
input[type="text"], input[type="password"], input[type="number"], input[type="date"], input[type="url"], select, textarea {
  width: 100%; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--line-2); background: var(--field);
  color: var(--text); font-family: inherit; font-size: .94rem; transition: border-color .15s;
}
textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
textarea.code { font-family: var(--mono); font-size: .8rem; line-height: 1.55; color: #cfd6e6; }
input:focus, select:focus, textarea:focus { outline: none; border-color: rgba(245, 165, 36, .7); box-shadow: 0 0 0 3px rgba(245, 165, 36, .15); }
select option { background: var(--panel); }
input[type="range"] { width: 100%; accent-color: var(--gold); }
input[type="checkbox"] { accent-color: var(--gold); width: 16px; height: 16px; }
.check { display: inline-flex; align-items: center; gap: 7px; font-size: .9rem; cursor: pointer; user-select: none; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 14px; }

.seg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.seg button {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--line-2);
  background: var(--field); color: var(--muted); font-family: inherit; font-weight: 600; font-size: .86rem; cursor: pointer; text-align: left;
}
.seg button.on { border-color: var(--gold); color: var(--text); background: rgba(245, 165, 36, .1); }
.seg button span { font-size: 1.1rem; }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 15px; border-radius: 11px;
  border: 1px solid transparent; font-family: inherit; font-weight: 700; font-size: .9rem; cursor: pointer; text-decoration: none;
  transition: transform .12s, filter .15s, background .15s; white-space: nowrap; color: var(--text);
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-gold { background: linear-gradient(180deg, var(--gold-2), var(--gold)); color: #1a1205; box-shadow: 0 8px 22px -10px rgba(245, 165, 36, .8); }
.btn-violet { background: linear-gradient(180deg, #a78bfa, var(--violet)); color: #fff; }
.btn-green { background: #1f9d6b; color: #fff; }
.btn-red { background: rgba(248, 113, 113, .14); color: var(--red); border-color: rgba(248, 113, 113, .35); }
.btn-ghost { background: rgba(255, 255, 255, .04); border-color: var(--line-2); }
.btn-ghost:hover { background: rgba(255, 255, 255, .08); }
.btn-sm { padding: 7px 11px; font-size: .82rem; border-radius: 9px; }
.btn-block { width: 100%; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-stack { display: grid; gap: 8px; }
.btn .spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; padding: 4px 10px; border-radius: 999px; font-size: .76rem; font-weight: 700; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .04); color: var(--muted); }
.chip-gold { color: var(--gold-2); border-color: rgba(245, 165, 36, .4); background: rgba(245, 165, 36, .1); }
.chip-violet { color: var(--violet-2); border-color: rgba(139, 92, 246, .45); background: rgba(139, 92, 246, .12); }
.chip-pink { color: #f9a8d4; border-color: rgba(236, 72, 153, .4); background: rgba(236, 72, 153, .1); }
.chip-green { color: #6ee7b7; border-color: rgba(52, 211, 153, .4); background: rgba(52, 211, 153, .1); }
.chip-red { color: var(--red); border-color: rgba(248, 113, 113, .4); background: rgba(248, 113, 113, .1); }

/* ---------- Plan ---------- */
.plan { padding: 12px 14px; border-radius: 12px; background: rgba(245, 165, 36, .07); border: 1px solid rgba(245, 165, 36, .3); font-size: .86rem; color: var(--gold-2); margin-bottom: 14px; }
.plan b { color: var(--text); }

/* ---------- Resultado ---------- */
.hero-result { border-color: rgba(245, 165, 36, .35); background: linear-gradient(180deg, rgba(245, 165, 36, .07), var(--bg-2) 60%); }
.title-input { font-size: 1.45rem !important; font-weight: 800; background: transparent !important; border-color: transparent !important; padding: 4px 0 !important; letter-spacing: -.02em; }
.title-input:focus { border-color: var(--line-2) !important; padding: 4px 8px !important; }
.hook { color: var(--muted); margin: 4px 0 14px; }
.scene { border-left: 3px solid var(--gold); }
.scene-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.scene-n { font-weight: 800; color: var(--gold-2); }
.copy-wrap { position: relative; }
.copy-wrap .btn { position: absolute; top: 6px; right: 6px; }
.copy-wrap textarea { padding-right: 86px; }
details.more { margin-top: 8px; }
details.more summary { cursor: pointer; color: var(--muted); font-size: .84rem; font-weight: 600; list-style: none; }
details.more summary::before { content: "▸ "; }
details.more[open] summary::before { content: "▾ "; }
details.more > div { margin-top: 8px; }
.empty { text-align: center; padding: 46px 24px; }
.empty .big { font-size: 2.4rem; margin-bottom: 8px; }
.empty p { color: var(--muted); max-width: 520px; margin: 6px auto 0; }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 22px; text-align: left; }
.mode { padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .02); }
.mode b { display: block; margin-bottom: 4px; }
.mode p { font-size: .84rem; margin: 0; }

/* ---------- Panel / Kanban ---------- */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.stat { padding: 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); }
.stat b { display: block; font-size: 1.7rem; font-weight: 800; letter-spacing: -.03em; }
.stat span { color: var(--muted); font-size: .84rem; }
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 22px; }
.quick button {
  display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; cursor: pointer; text-align: left;
  border: 1px solid var(--line-2); background: linear-gradient(180deg, var(--panel-2), var(--panel)); color: var(--text); font-family: inherit;
  transition: border-color .15s, transform .15s;
}
.quick button:hover { border-color: var(--gold); transform: translateY(-2px); }
.quick .qi { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; font-size: 1.3rem; background: rgba(245, 165, 36, .12); }
.quick b { display: block; font-size: .92rem; }
.quick small { color: var(--muted); font-size: .78rem; }
.kanban { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col { background: rgba(255, 255, 255, .02); border: 1px solid var(--line); border-radius: 14px; padding: 10px; min-height: 160px; }
.col-head { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 10px; font-weight: 700; font-size: .86rem; }
.col-head span { font-family: var(--mono); color: var(--muted); font-size: .78rem; }
.pcard { display: block; padding: 11px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel); margin-bottom: 8px; text-decoration: none; transition: border-color .15s; }
.pcard:hover { border-color: var(--line-2); }
.pcard b { display: block; font-size: .88rem; margin: 4px 0; }
.pcard .meta { display: flex; justify-content: space-between; align-items: center; gap: 6px; color: var(--muted); font-size: .76rem; }
.pcard .mv { display: flex; gap: 4px; }
.pcard .mv button { border: 1px solid var(--line-2); background: none; color: var(--muted); border-radius: 6px; cursor: pointer; padding: 0 6px; font-size: .8rem; }
.dotc { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.list { display: grid; gap: 8px; }
.list-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--line); background: rgba(255, 255, 255, .02); }

/* ---------- Marcas ---------- */
.brands { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.bcard { cursor: pointer; transition: border-color .15s; position: relative; overflow: hidden; }
.bcard:hover { border-color: var(--line-2); }
.bcard::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--c, var(--gold)); }
.bcard p { color: var(--muted); font-size: .86rem; margin: 6px 0 10px; }

/* ---------- Voces ---------- */
.voices { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 7px; max-height: 260px; overflow: auto; padding-right: 4px; }
.voice { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--field); cursor: pointer; text-align: left; color: var(--text); font-family: inherit; }
.voice b { display: block; font-size: .84rem; }
.voice small { color: var(--muted); font-size: .74rem; }
.voice.on { border-color: var(--violet); background: rgba(139, 92, 246, .15); }
.take { display: grid; gap: 8px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, .02); }
.take.on { border-color: rgba(52, 211, 153, .5); background: rgba(52, 211, 153, .05); }
.take audio { width: 100%; height: 38px; }

/* ---------- Ensamblador ---------- */
.drop { border: 1.5px dashed var(--line-2); border-radius: 13px; padding: 18px; text-align: center; color: var(--muted); cursor: pointer; transition: border-color .15s, background .15s; }
.drop:hover, .drop.over { border-color: var(--gold); background: rgba(245, 165, 36, .05); color: var(--text); }
.drop input { display: none; }
.clips { display: grid; gap: 6px; margin-top: 10px; max-height: 280px; overflow: auto; }
.clip { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255, 255, 255, .02); }
.clip .th { width: 34px; height: 48px; border-radius: 6px; background: #000 center/cover; flex-shrink: 0; overflow: hidden; }
.clip .th video, .clip .th img { width: 100%; height: 100%; object-fit: cover; }
.clip .nm { flex: 1; min-width: 0; font-size: .82rem; }
.clip .nm b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clip .nm small { color: var(--muted); font-family: var(--mono); }
.clip button { border: 1px solid var(--line-2); background: none; color: var(--muted); border-radius: 7px; cursor: pointer; width: 28px; height: 28px; }
.clip button:hover { color: var(--text); }
.stage { display: grid; place-items: center; padding: 18px; border-radius: var(--r); background: #04060c; border: 1px solid var(--line); }
.stage canvas { max-width: 100%; max-height: 66vh; border-radius: 14px; box-shadow: 0 20px 60px -20px rgba(0, 0, 0, .8), 0 0 0 1px var(--line-2); background: #05070e; }
.timebar { height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; margin: 14px 0 8px; }
.timebar div { height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), var(--pink)); }
.vol { display: grid; grid-template-columns: 70px 1fr 40px; align-items: center; gap: 8px; font-size: .84rem; color: var(--muted); }

/* ---------- Modal y avisos ---------- */
.modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; background: rgba(3, 5, 12, .72); backdrop-filter: blur(6px); }
.modal .card { width: min(640px, 100%); max-height: 90vh; overflow: auto; }
.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 200; display: grid; gap: 8px; }
.toast { padding: 11px 14px; border-radius: 11px; background: var(--panel-2); border: 1px solid var(--line-2); box-shadow: 0 12px 30px -10px rgba(0, 0, 0, .7); font-size: .9rem; max-width: 360px; animation: up .2s ease; }
.toast.ok { border-color: rgba(52, 211, 153, .5); }
.toast.error { border-color: rgba(248, 113, 113, .6); }
@keyframes up { from { transform: translateY(8px); opacity: 0; } }
.note { padding: 11px 13px; border-radius: 11px; font-size: .85rem; background: rgba(96, 165, 250, .08); border: 1px solid rgba(96, 165, 250, .3); color: #bfdbfe; }
.note.warn { background: rgba(245, 165, 36, .08); border-color: rgba(245, 165, 36, .35); color: var(--gold-2); }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }

/* ---------- Responsive ---------- */
@media (max-width: 1180px) {
  .grid-2 { grid-template-columns: 1fr; }
  .sticky { position: static; }
  .kanban { grid-template-columns: repeat(5, 230px); }
}
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side {
    position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; z-index: 50; flex-direction: row; justify-content: space-around;
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); border-right: 0; border-top: 1px solid var(--line); background: rgba(9, 13, 26, .96); backdrop-filter: blur(12px);
  }
  .side .brand, .side-foot { display: none; }
  .nav-item { flex-direction: column; gap: 3px; padding: 6px 2px; font-size: .6rem; flex: 1; text-align: center; min-width: 0; }
  .nav-item svg { width: 18px; height: 18px; }
  .nav-item.active { box-shadow: none; background: rgba(245, 165, 36, .12); }
  .stats, .quick { grid-template-columns: repeat(2, 1fr); }
  .modes { grid-template-columns: 1fr; }
  .main { padding-top: 18px; }
}
@media (max-width: 480px) {
  .row, .row-3 { grid-template-columns: 1fr; }
  .seg { grid-template-columns: 1fr 1fr; }
  .card { padding: 14px; }
}

</style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <a class="brand" href="#/panel">
        <span class="brand-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/></svg></span>
        <span><b>Vocalis Studio</b><small>ESTUDIO PRO</small></span>

  <script>
/* Datos del estudio.
   - En Netlify (con contraseña configurada): todo se guarda en la nube de tu sitio y se sincroniza entre equipos.
   - Abierto como archivo local: se guarda solo en este navegador.
   Copia local en localStorage/IndexedDB para que abra rápido y aguante cortes de internet. */
window.VS = window.VS || {};
(function (VS) {
  "use strict";
  const KEY = "vocalis.studio.v2";
  const KEY_SYNC = "vocalis.studio.v2.sync"; // momento de la última sincronización

  const defaults = () => ({
    settings: {
      appName: "Vocalis Studio",
      apiKey: "",
      modelText: "gemini-3.8-flash",
      modelTTS: "gemini-3.8-flash-tts",
      modelImage: "gemini-nano-banana-2.1",
      modelVideo: "gemini-omni-1.1-flash",
      modoPro: false,
      wps: 2.5,
      clip: 8,
      promptLang: "en",
      actualizado: 0,
    },
    brands: [],
    projects: [],
  });

  let state;
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem("vocalis.studio.v1") || "null");
    state = Object.assign(defaults(), raw || {});
    state.settings = Object.assign(defaults().settings, (raw && raw.settings) || {});
  } catch (e) {
    state = defaults();
  }

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  /* ---------- Nube ---------- */
  const cloud = { on: false, estado: "local", pendientes: 0, error: "" };
  const enviado = { brands: new Map(), projects: new Map(), settings: new Map() }; // último JSON enviado por id
  let tSync = null;

  function avisar() {
    VS.alSincronizar && VS.alSincronizar(cloud);
  }

  async function api(path, opts) {
    const r = await fetch(path, Object.assign({ credentials: "same-origin", cache: "no-store" }, opts || {}));
    if (r.status === 401 && !String(path).startsWith("/api/entrar")) {
      cloud.estado = "sesion";
      avisar();
      setTimeout(() => location.reload(), 1200);
      throw new Error("Tu sesión venció. Vuelve a entrar.");
    }
    if (!r.ok) {
      let msg = "Error " + r.status;
      try { msg = (await r.json()).error || msg; } catch (e) { /* */ }
      throw new Error(msg);
    }
    return r;
  }

  async function bajarTodo(tipo) {
    const items = [];
    let offset = 0;
    while (offset !== null) {
      const d = await (await api(`/api/data?type=${tipo}&offset=${offset}`)).json();
      items.push(...d.items);
      offset = d.next;
    }
    return items;
  }

  const sello = (x) => Number(x && (x.actualizado || x.creado)) || 0;

  // Une lo de la nube con la copia local: gana lo más reciente. Lo que solo existe local y es
  // anterior a la última sincronización se considera borrado en otro equipo.
  function unir(local, remoto, ultima) {
    const porId = new Map(remoto.map((x) => [x.id, x]));
    const subir = [];
    local.forEach((x) => {
      const r = porId.get(x.id);
      if (!r) {
        if (sello(x) > ultima) { porId.set(x.id, x); subir.push(x); }
      } else if (sello(x) > sello(r)) {
        porId.set(x.id, x);
        subir.push(x);
      }
    });
    return { lista: Array.from(porId.values()), subir };
  }

  async function iniciar() {
    let ping = null;
    try {
      if (location.protocol.startsWith("http")) {
        const r = await fetch("/api/ping", { credentials: "same-origin", cache: "no-store" });
        let d = null;
        try { d = await r.json(); } catch (e) { /* no es la API */ }
        if (r.ok && d) ping = d;
        else if (r.status === 401 && d && d.login) return { acceso: "login" };
        else if (r.status === 503 && d && d.config) return { acceso: "config" };
      }
    } catch (e) { /* sin nube */ }
    if (!ping || !ping.cloud) {
      cloud.on = false;
      cloud.estado = "local";
      sembrar();
      avisar();
      return;
    }
    cloud.on = true;
    cloud.estado = "cargando";
    avisar();
    try {
      const ultima = Number(localStorage.getItem(KEY_SYNC)) || 0;
      const [brands, projects, sets] = await Promise.all([bajarTodo("brands"), bajarTodo("projects"), bajarTodo("settings")]);
      const b = unir(state.brands, brands, ultima);
      const p = unir(state.projects, projects, ultima);
      state.brands = b.lista;
      state.projects = p.lista.sort((x, y) => sello(y) - sello(x));
      const rs = sets[0];
      if (rs && sello(rs) >= sello(state.settings)) state.settings = Object.assign(defaults().settings, rs);
      // marcar como ya enviado lo que vino de la nube
      brands.forEach((x) => enviado.brands.set(x.id, JSON.stringify(x)));
      projects.forEach((x) => enviado.projects.set(x.id, JSON.stringify(x)));
      if (rs) enviado.settings.set("main", JSON.stringify(rs));
      sembrar();
      guardarLocal();
      localStorage.setItem(KEY_SYNC, String(Date.now()));
      cloud.estado = "ok";
      avisar();
      if (b.subir.length || p.subir.length || !rs) programarSync(10);
    } catch (e) {
      cloud.estado = "offline";
      cloud.error = e.message;
      avisar();
    }
  }

  function programarSync(ms) {
    if (!cloud.on) return;
    clearTimeout(tSync);
    tSync = setTimeout(sincronizar, ms == null ? 700 : ms);
  }

  async function sincronizar() {
    if (!cloud.on) return;
    const tareas = [];
    const revisar = (tipo, lista) => {
      lista.forEach((x) => {
        const s = JSON.stringify(x);
        if (enviado[tipo].get(x.id) !== s) tareas.push({ tipo, id: x.id, s });
      });
    };
    revisar("brands", state.brands);
    revisar("projects", state.projects);
    const ss = Object.assign({}, state.settings, { id: "main" });
    const sj = JSON.stringify(ss);
    if (enviado.settings.get("main") !== sj) tareas.push({ tipo: "settings", id: "main", s: sj });
    if (!tareas.length) {
      if (cloud.estado !== "ok") { cloud.estado = "ok"; avisar(); }
      return;
    }
    cloud.estado = "guardando";
    cloud.pendientes = tareas.length;
    avisar();
    let fallo = null;
    for (const t of tareas) {
      try {
        await api(`/api/item/${t.tipo}/${encodeURIComponent(t.id)}`, { method: "PUT", headers: { "content-type": "application/json" }, body: t.s });
        enviado[t.tipo].set(t.id, t.s);
        cloud.pendientes--;
      } catch (e) {
        fallo = e;
        break;
      }
    }
    if (fallo) {
      cloud.estado = "offline";
      cloud.error = fallo.message;
      avisar();
      programarSync(15000); // reintenta
    } else {
      localStorage.setItem(KEY_SYNC, String(Date.now()));
      cloud.estado = "ok";
      avisar();
    }
  }

  async function borrarRemoto(tipo, id) {
    enviado[tipo].delete(id);
    if (!cloud.on) return;
    try {
      await api(`/api/item/${tipo}/${encodeURIComponent(id)}`, { method: "DELETE" });
    } catch (e) {
      VS.toast && VS.toast("No se pudo borrar en la nube: " + e.message, "error");
    }
  }

  function guardarLocal() {
    try {
      localStorage.setItem("vocalis.nombre", state.settings.appName || "");
      localStorage.setItem(KEY, JSON.stringify(state));
      return true;
    } catch (e) {
      // con nube activa, la copia local es opcional
      if (!cloud.on) VS.toast && VS.toast("El almacenamiento de este navegador está lleno. Exporta un respaldo o publica el estudio en Netlify para guardar sin límite.", "error");
      return false;
    }
  }

  function save() {
    guardarLocal();
    programarSync();
  }

  function sembrar() {
    if (state.brands.length || state.projects.length) return;
    state.brands.push({
      id: uid(), creado: Date.now(), actualizado: Date.now(),
      nombre: "Empresa de ejemplo",
      nicho: "Café y desayunos",
      productos: "Cafés especiales, desayunos completos, picadas y comidas rápidas",
      oferta: "Café de origen colombiano, ambiente familiar, domicilios",
      contacto: "Pedidos por WhatsApp",
      publico: "Familias y trabajadores del barrio",
      idioma: "español",
      estetica: "Warm cozy Colombian café, morning sunlight, steam rising from coffee cups, rustic wood, golden and brown palette, appetizing close-ups",
      tono: "Cálido, cercano y alegre",
      voz: { voice: "Sulafat", estilo: "Warm, friendly, smiling delivery", arquetipo: "Anfitriona cálida" },
      cta: "Pide ya por WhatsApp",
      hashtags: "#cafe #desayunos #domicilios",
      color: "#f5a524",
    });
  }

  const store = {
    get state() { return state; },
    cloud,
    iniciar,
    save,
    sincronizar,
    uid,
    brand: (id) => state.brands.find((b) => b.id === id),
    project: (id) => state.projects.find((p) => p.id === id),
    upsertBrand(b) {
      if (!b.id) { b.id = uid(); b.creado = Date.now(); }
      b.actualizado = Date.now();
      const i = state.brands.findIndex((x) => x.id === b.id);
      i >= 0 ? (state.brands[i] = b) : state.brands.push(b);
      save();
      return b;
    },
    deleteBrand(id) {
      state.brands = state.brands.filter((b) => b.id !== id);
      state.projects.forEach((p) => { if (p.marcaId === id) { p.marcaId = ""; p.actualizado = Date.now(); } });
      save();
      borrarRemoto("brands", id);
    },
    upsertProject(p) {
      if (!p.id) { p.id = uid(); p.creado = Date.now(); }
      p.actualizado = Date.now();
      const i = state.projects.findIndex((x) => x.id === p.id);
      i >= 0 ? (state.projects[i] = p) : state.projects.unshift(p);
      save();
      return p;
    },
    tocar(p) { p.actualizado = Date.now(); save(); },
    deleteProject(id) {
      state.projects = state.projects.filter((p) => p.id !== id);
      save();
      borrarRemoto("projects", id);
      VS.media.delPrefix(id + "__");
    },
    guardarAjustes() {
      state.settings.actualizado = Date.now();
      save();
    },
    exportJSON() {
      const copy = JSON.parse(JSON.stringify(state));
      copy.settings.apiKey = ""; // la llave nunca sale en el respaldo
      return copy;
    },
    importJSON(obj) {
      if (!obj || !Array.isArray(obj.projects) || !Array.isArray(obj.brands)) throw new Error("El archivo no es un respaldo válido.");
      const key = state.settings.apiKey;
      const ahora = Date.now();
      const viejos = { b: state.brands.map((x) => x.id), p: state.projects.map((x) => x.id) };
      state.brands = obj.brands.map((x) => Object.assign(x, { actualizado: ahora }));
      state.projects = obj.projects.map((x) => Object.assign(x, { actualizado: ahora }));
      state.settings = Object.assign(defaults().settings, obj.settings || {}, { apiKey: key, actualizado: ahora });
      viejos.b.filter((id) => !store.brand(id)).forEach((id) => borrarRemoto("brands", id));
      viejos.p.filter((id) => !store.project(id)).forEach((id) => borrarRemoto("projects", id));
      save();
    },
    reset() {
      const key = state.settings.apiKey, nombre = state.settings.appName;
      state.brands.forEach((b) => borrarRemoto("brands", b.id));
      state.projects.forEach((p) => borrarRemoto("projects", p.id));
      state = defaults();
      Object.assign(state.settings, { apiKey: key, appName: nombre, actualizado: Date.now() });
      save();
    },
  };
  VS.store = store;

  /* ---------- Audios: IndexedDB local + nube ---------- */
  const DB = "vocalis-media", OS = "blobs";
  const MAX_NUBE = 4.5 * 1024 * 1024; // límite por archivo en la nube
  let dbp = null;
  function db() {
    if (!dbp) {
      dbp = new Promise((res, rej) => {
        const r = indexedDB.open(DB, 1);
        r.onupgradeneeded = () => r.result.createObjectStore(OS);
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    }
    return dbp;
  }
  async function tx(mode, fn) {
    const d = await db();
    return new Promise((res, rej) => {
      const t = d.transaction(OS, mode);
      const req = fn(t.objectStore(OS));
      t.oncomplete = () => res(req && "result" in req ? req.result : undefined);
      t.onerror = () => rej(t.error);
    });
  }
  const local = {
    put: (k, v) => tx("readwrite", (os) => os.put(v, k)),
    get: (k) => tx("readonly", (os) => os.get(k)),
    del: (k) => tx("readwrite", (os) => os.delete(k)),
    keys: () => tx("readonly", (os) => os.getAllKeys()),
  };

  VS.media = {
    // val = { blob, voice, estilo, fecha, origen }
    async put(key, val) {
      await local.put(key, val);
      if (!cloud.on) return { nube: false };
      if (val.blob.size > MAX_NUBE) return { nube: false, motivo: "grande" };
      const meta = { voice: val.voice || "", estilo: val.estilo || "", fecha: String(val.fecha || Date.now()), origen: val.origen || "" };
      await api(`/api/media/${encodeURIComponent(key)}`, {
        method: "PUT",
        headers: { "content-type": val.blob.type || "audio/wav", "x-meta": JSON.stringify(meta).replace(/[^\x20-\x7e]/g, "") },
        body: val.blob,
      });
      return { nube: true };
    },
    async get(key) {
      let v = null;
      try { v = await local.get(key); } catch (e) { /* */ }
      if (v || !cloud.on) return v;
      try {
        const r = await api(`/api/media/${encodeURIComponent(key)}`);
        const meta = JSON.parse(r.headers.get("x-meta") || "{}");
        const blob = await r.blob();
        v = { blob: new Blob([blob], { type: meta.type || blob.type || "audio/wav" }), voice: meta.voice, estilo: meta.estilo, fecha: Number(meta.fecha) || Date.now(), origen: meta.origen };
        local.put(key, v).catch(() => {});
      } catch (e) { v = null; }
      return v;
    },
    async del(key) {
      try { await local.del(key); } catch (e) { /* */ }
      if (cloud.on) { try { await api(`/api/media/${encodeURIComponent(key)}`, { method: "DELETE" }); } catch (e) { /* */ } }
    },
    async keys(prefix) {
      const set = new Set();
      try { (await local.keys()).forEach((k) => String(k).startsWith(prefix) && set.add(String(k))); } catch (e) { /* */ }
      if (cloud.on) {
        try { (await (await api(`/api/media?prefix=${encodeURIComponent(prefix)}`)).json()).keys.forEach((k) => set.add(k)); } catch (e) { /* */ }
      }
      return Array.from(set);
    },
    async delPrefix(prefix) {
      for (const k of await this.keys(prefix)) await this.del(k);
    },
  };
})(window.VS);

</script>
  <script>
/* Motor de guiones: prompt maestro para Gemini, lectura de respuestas,
   borrador sin IA, exportaciones (ficha, prompts, SRT) y tiempos de subtítulos. */
window.VS = window.VS || {};
(function (VS) {
  "use strict";

  const TIPOS = {
    short:  { label: "Reel / TikTok / Short", icono: "📱", duraciones: [15, 30, 45, 60, 90], formato: "9:16", video: true },
    largo:  { label: "Video largo (YouTube)",  icono: "🎬", duraciones: [120, 180, 300, 480, 600], formato: "16:9", video: true },
    cuna:   { label: "Cuña comercial / radio", icono: "📻", duraciones: [15, 20, 30, 45, 60], formato: "audio", video: false },
    jingle: { label: "Jingle",                 icono: "🎵", duraciones: [15, 30, 60], formato: "audio", video: false },
  };

  const ATMOSFERAS = [
    "Auto (la IA decide según el nicho)",
    "Cinemático épico",
    "Cálido y cercano",
    "Lujo y elegancia",
    "Energético y urbano",
    "Místico y espiritual",
    "Tropical / Pacífico colombiano",
    "Minimalista y limpio",
    "Documental realista",
    "Animación 3D estilo Pixar",
    "Nocturno y sensual",
  ];

  const ESTADOS = [
    { id: "idea", label: "Idea" },
    { id: "guion", label: "Guion" },
    { id: "produccion", label: "Producción" },
    { id: "listo", label: "Listo" },
    { id: "publicado", label: "Publicado" },
  ];

  const plataformasVideo = ["TikTok", "Reels", "Shorts", "Facebook", "YouTube"];

  /* ---------- Plan de producción (cuántos clips y palabras) ---------- */
  function plan(p) {
    const s = VS.store.state.settings;
    const wps = Number(s.wps) || 2.5;
    const T = TIPOS[p.tipo] || TIPOS.short;
    const dur = Number(p.duracion) || T.duraciones[1];
    if (!T.video) {
      return { escenas: 0, clips: [], palabras: Math.round(dur * wps * (p.tipo === "jingle" ? 0.7 : 0.92)), dur, wps };
    }
    const clip = Number(p.clip) || s.clip || 8;
    const n = Math.max(1, Math.ceil(dur / clip));
    const clips = Array.from({ length: n }, (_, i) => (i < n - 1 ? clip : Math.max(4, dur - clip * (n - 1))));
    const real = clips.reduce((a, b) => a + b, 0);
    return {
      escenas: n,
      clips,
      dur: real,
      wps,
      palabras: Math.round(real * wps * 0.92),
      porEscena: clips.map((c) => Math.round(c * wps * 0.92)),
    };
  }

  function contexto(p, b) {
    b = b || {};
    const v = b.voz || {};
    return [
      `Empresa / página: ${b.nombre || "Sin marca"}`,
      `Nicho: ${b.nicho || "general"}`,
      b.productos ? `Productos o servicios: ${b.productos}` : "",
      b.oferta ? `Diferenciales y ofertas: ${b.oferta}` : "",
      b.contacto ? `Contacto / canal de pedidos: ${b.contacto}` : "",
      `Público: ${b.publico || "general"}`,
      `Idioma de la locución y textos: ${p.idioma || b.idioma || "español"}`,
      `Estética visual de la marca: ${b.estetica || "libre, coherente con el nicho"}`,
      `Tono: ${b.tono || "cercano y claro"}`,
      `Arquetipo de voz: ${v.arquetipo || "narrador"} — ${v.estilo || ""}`,
      `Llamado a la acción preferido: ${p.cta || b.cta || "seguir la cuenta"}`,
      `Hashtags base: ${b.hashtags || ""}`,
      `Atmósfera pedida: ${p.atmosfera || ATMOSFERAS[0]}`,
      `Tema o enfoque: ${p.tema || "elige el tema con más potencial viral para el nicho"}`,
    ].filter(Boolean).join("\n");
  }

  /* ---------- Temas para producción automática ---------- */
  function promptTemas(b, cantidades, usados) {
    const pide = Object.entries(cantidades).filter(([, n]) => n > 0);
    const guia = {

  function parseLote(text) {

  /* ---------- Prompt maestro ---------- */

  /* ---------- Leer la respuesta de Gemini ---------- */
  function parse(text) {
    if (!text) throw new Error("Respuesta vacía.");
    let t = String(text).trim().replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
    const a = t.indexOf("{"), z = t.lastIndexOf("}");

  function normalizar(o) {

  /* ---------- Borrador rápido sin IA ---------- */

    if (r.prompt_musica) L.push(`PROMPT MÚSICA: ${r.prompt_musica}`);
    if (r.sfx.length) L.push(`SFX: ${r.sfx.join(" · ")}`);
    if (r.voz.estilo) L.push(`DIRECCIÓN DE VOZ: ${r.voz.estilo}`);

  /* ---------- Subtítulos con tiempos ---------- */
  // Reparte el texto en el tiempo total según la longitud de cada palabra (más pausa en puntuación).
  function subtitulos(texto, total, porGrupo) {

    const peso = palabras.map((w) => w.length + 2 + (/[.!?…]$/.test(w) ? 6 : /[,;:]$/.test(w) ? 3 : 0));
    const suma = peso.reduce((a, b) => a + b, 0);

    const ws = palabras.map((w, i) => {
      const d = (peso[i] / suma) * total;

      t += d;
      return o;

    const grupos = [];
    let g = [];
    ws.forEach((w, i) => {

      const fin = /[.!?…,;:]$/.test(w.w) && g.length >= 2;

  }

    const out = [];
    r.escenas.forEach((e) => {
      subtitulos(e.locucion, e.duracion).forEach((g) => out.push({ start: g.start + t, end: g.end + t, words: g.words }));

    ["Achird", "Amigable"], ["Zubenelgenubi", "Casual"], ["Vindemiatrix", "Gentil"], ["Sadachbia", "Vivaz"],
    ["Sadaltager", "Experta"], ["Sulafat", "Cálida"],
  ];

  function llave() {
    const k = VS.store.state.settings.apiKey;
    if (!k) throw new Error("Agrega tu API key de Gemini en Ajustes para usar la generación automática.");
    return k;
  }

  async function errorDe(r) {
    let msg = `Error ${r.status}`;
    try {
      const d = await r.json();
      msg = (d.error && d.error.message) || msg;
    } catch (e) { /* sin cuerpo */ }
    if (r.status === 400 && /api key/i.test(msg)) msg = "La API key no es válida. Revísala en Ajustes.";
    if (r.status === 403) msg = "La API key no tiene permiso para este modelo. " + msg;
    if (r.status === 429) msg = "Llegaste al límite de uso de tu plan de Gemini. Espera un momento o revisa tu cuota. " + msg;
    const e = new Error(msg);
    e.status = r.status;
    return e;
  }

  const headers = () => ({ "Content-Type": "application/json", "x-goog-api-key": llave() });

  /* ---------- Texto ---------- */
  async function texto(prompt, json) {
    const s = VS.store.state.settings;
    // 1) generateContent
    let r = await fetch(`${BASE}/models/${encodeURIComponent(s.modelText)}:generateContent`, {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({
        contents: [{ role: "user", parts: [{ text: prompt }] }],
        generationConfig: json ? { responseMimeType: "application/json" } : {},
      }),
    });
    if (r.ok) {
      const d = await r.json();
      const parts = (d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts) || [];
      const t = parts.filter((p) => !p.thought).map((p) => p.text || "").join("");
      if (t) return t;
    } else if ([400, 401, 403, 429].includes(r.status) && !(r.status === 400 && json)) {
      throw await errorDe(r);
    }
    // 2) Interactions API (respaldo)
    r = await fetch(`${BASE}/interactions`, {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({ model: s.modelText, input: [{ type: "user_input", content: [{ type: "text", text: prompt }] }] }),
    });
    if (!r.ok) throw await errorDe(r);
    const d = await r.json();
    const t = (d.steps || [])
      .filter((st) => st.type === "model_output")
      .flatMap((st) => st.content || [])
      .filter((c) => c.type === "text")
      .map((c) => c.text)
      .join("");
    if (!t) throw new Error("Gemini no devolvió texto.");
    return t;
  }

  /* ---------- Voz (TTS) ---------- */
  function b64aBytes(b64) {
    const bin = atob(b64);
    const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }

  function pcmAWav(pcm, rate) {
    rate = rate || 24000;
    const h = new ArrayBuffer(44);
    const v = new DataView(h);
    const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    w(0, "RIFF"); v.setUint32(4, 36 + pcm.length, true); w(8, "WAVE"); w(12, "fmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, "data"); v.setUint32(40, pcm.length, true);

  function aBlob(bytes, mime) {
    const riff = bytes[0] === 0x52 && bytes[1] === 0x49 && bytes[2] === 0x46 && bytes[3] === 0x46;
    if (riff) return new Blob([bytes], { type: "audio/wav" });
    if (mime && /mpeg|mp3|ogg|webm/.test(mime)) return new Blob([bytes], { type: mime });
    const m = /rate=(\d+)/.exec(mime || "");
    return pcmAWav(bytes, m ? Number(m[1]) : 24000);
  }

  async function voz(texto, voice, estilo) {
    const s = VS.store.state.settings;
    const content = { type: "text", text: texto };
    if (estilo) content.annotations = [{ type: "speech_metadata", style: estilo }];
    // 1) Interactions API (formato documentado actual)
    let r = await fetch(`${BASE}/interactions`, {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({
        model: s.modelTTS,
        input: [{ type: "user_input", content: [content] }],
        response_format: { type: "audio" },
        generation_config: { speech_config: [{ voice }] },
      }),
    });
    if (r.ok) {
      const d = await r.json();
      const audios = (d.steps || [])
        .filter((st) => st.type === "model_output")
        .flatMap((st) => st.content || [])
        .filter((c) => c.type === "audio" && c.data);
      const a = audios[audios.length - 1];
      if (a) return aBlob(b64aBytes(a.data), a.mime_type);
    } else if ([401, 403, 429].includes(r.status)) {
      throw await errorDe(r);
    }
    // 2) generateContent (respaldo)
    r = await fetch(`${BASE}/models/${encodeURIComponent(s.modelTTS)}:generateContent`, {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({
        contents: [{ parts: [{ text: estilo ? `Say in this style (${estilo}): ${texto}` : texto }] }],
        generationConfig: {
          responseModalities: ["AUDIO"],
          speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voice } } },
        },
      }),
    });
    if (!r.ok) throw await errorDe(r);
    const d = await r.json();
    const part = ((d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts) || []).find((p) => p.inlineData);
    if (!part) throw new Error("Gemini no devolvió audio.");
    return aBlob(b64aBytes(part.inlineData.data), part.inlineData.mimeType);
  }

  /* ---------- Imágenes y clips de video ---------- */
  const salidas = (d, tipo) => (d.steps || [])
    .filter((st) => st.type === "model_output")
    .flatMap((st) => st.content || [])
    .filter((c) => c.type === tipo && (c.data || c.uri));

  const aBase64 = (blob) => new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1]);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });

  async function descargarUri(uri, mimeDefecto) {
    let r = await fetch(uri, { headers: { "x-goog-api-key": llave() } });
    if (!r.ok) r = await fetch(uri + (uri.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(llave()));
    if (!r.ok) throw await errorDe(r);
    const b = await r.blob();
    return b.type && b.type !== "application/octet-stream" ? b : new Blob([b], { type: mimeDefecto });
  }

  async function aArchivo(c, mimeDefecto) {
    if (c.data) return new Blob([b64aBytes(c.data)], { type: c.mime_type || mimeDefecto });
    return descargarUri(c.uri, c.mime_type || mimeDefecto);
  }

  // Imagen con Nano Banana (aspecto: 9:16, 16:9, 1:1, 4:5)
  async function imagen(prompt, aspecto) {
    const s = VS.store.state.settings;
    const modelo = s.modelImage || "gemini-nano-banana-2.1";
    let r = await fetch(`${BASE}/interactions`, {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({
        model: modelo,
        input: prompt,
        response_format: { type: "image", mime_type: "image/jpeg", aspect_ratio: aspecto, image_size: "2K" },
      }),
    });
    if (r.ok) {
      const im = salidas(await r.json(), "image");
      if (im.length) return aArchivo(im[im.length - 1], "image/jpeg");
    } else if ([401, 403, 429].includes(r.status)) {
      throw await errorDe(r);
    }
    // respaldo: generateContent
    r = await fetch(`${BASE}/models/${encodeURIComponent(modelo)}:generateContent`, {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { responseModalities: ["IMAGE"], imageConfig: { aspectRatio: aspecto } },
      }),
    });
    if (!r.ok) throw await errorDe(r);
    const d = await r.json();
    const part = ((d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts) || []).find((x) => x.inlineData);
    if (!part) throw new Error("Gemini no devolvió imagen. Prueba con otra descripción.");
    return new Blob([b64aBytes(part.inlineData.data)], { type: part.inlineData.mimeType || "image/png" });
  }

  // Clip de video con Gemini Omni Flash (aspecto 9:16 o 16:9). Si llega una imagen, la usa como primer cuadro.
  async function videoClip(prompt, aspecto, imagenBlob) {
    const s = VS.store.state.settings;
    const cuerpo = {
      model: s.modelVideo || "gemini-omni-1.1-flash",
      input: prompt,
      response_format: { type: "video", aspect_ratio: aspecto === "16:9" ? "16:9" : "9:16", resolution: "720p" },
      store: false,
    };
    if (imagenBlob) {
      cuerpo.input = [
        { type: "image", data: await aBase64(imagenBlob), mime_type: imagenBlob.type || "image/jpeg" },
        { type: "text", text: prompt },
      ];
      cuerpo.generation_config = { video_config: { task: "image_to_video" } };
    }
    const r = await fetch(`${BASE}/interactions`, { method: "POST", headers: headers(), body: JSON.stringify(cuerpo) });
    if (!r.ok) throw await errorDe(r);
    const vids = salidas(await r.json(), "video");
    if (!vids.length) throw new Error("Gemini no devolvió el video. Revisa la descripción o intenta de nuevo.");
    return aArchivo(vids[vids.length - 1], "video/mp4");
  }

  async function probar() {
    const t = await texto('Responde solo con la palabra "listo".', false);
    return t.trim();
  }

  VS.gemini = { VOCES, texto, voz, imagen, videoClip, probar };
})(window.VS);

/* Muxer MP4 propio (sin librerías externas).
   Une video (H.264 o VP9) y audio (AAC u Opus) ya codificados en un archivo MP4 "faststart". */
window.VS = window.VS || {};
(function (VS) {
  "use strict";

  const enc = new TextEncoder();
  const u8 = (arr) => new Uint8Array(arr);
  const u16 = (n) => u8([(n >>> 8) & 255, n & 255]);
  const u24 = (n) => u8([(n >>> 16) & 255, (n >>> 8) & 255, n & 255]);
  const u32 = (n) => u8([(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255]);
  const i16 = (n) => u16(n & 0xffff);
  const str = (s) => enc.encode(s);
  const zeros = (n) => new Uint8Array(n);

  function cat(parts) {
    let len = 0;
    for (const p of parts) len += p.length;
    const out = new Uint8Array(len);
    let o = 0;
    for (const p of parts) { out.set(p, o); o += p.length; }
    return out;
  }
  const box = (type, ...parts) => {
    const body = cat(parts);
    return cat([u32(8 + body.length), str(type), body]);
  };
  const fullbox = (type, version, flags, ...parts) => box(type, u8([version]), u24(flags), ...parts);
  const MATRIZ = cat([u32(0x00010000), u32(0), u32(0), u32(0), u32(0x00010000), u32(0), u32(0), u32(0), u32(0x40000000)]);

  // Descriptor MPEG-4 con longitud en 4 bytes (formato de tamaño expandido)
  const desc = (tag, ...parts) => {
    const body = cat(parts);
    const n = body.length;
    return cat([u8([tag, 0x80 | ((n >>> 21) & 127), 0x80 | ((n >>> 14) & 127), 0x80 | ((n >>> 7) & 127), n & 127]), body]);
  };

  function ascAAC(sampleRate, channels) {
    const tabla = [96000, 88200, 64000, 48000, 44100, 32000, 24000, 22050, 16000, 12000, 11025, 8000, 7350];
    const fi = Math.max(0, tabla.indexOf(sampleRate));
    const v = (2 << 11) | (fi << 7) | (channels << 3);
    return u8([(v >>> 8) & 255, v & 255]);
  }

  function entradaVideo(v) {
    const comun = cat([
      zeros(6), u16(1), // reservado + data_reference_index
      zeros(16), u16(v.width), u16(v.height),
      u32(0x00480000), u32(0x00480000), u32(0), u16(1),
      zeros(32), u16(0x0018), i16(-1),
    ]);
    if (v.codec === "avc") return box("avc1", comun, box("avcC", v.description));
    // VP9: caja vpcC (perfil 0, 8 bits, 4:2:0, BT.709)
    const vpcC = fullbox("vpcC", 1, 0, u8([0, 40, (8 << 4) | (1 << 1) | 0, 1, 1, 1]), u16(0));
    return box("vp09", comun, vpcC);
  }

  function entradaAudio(a) {
    const comun = cat([zeros(6), u16(1), zeros(8), u16(a.channels), u16(16), u16(0), u16(0), u32(a.sampleRate * 65536 >>> 0)]);
    if (a.codec === "aac") {
      const asc = a.description && a.description.length ? a.description : ascAAC(a.sampleRate, a.channels);
      const es = desc(3, u16(2), u8([0]),
        desc(4, u8([0x40, 0x15]), u24(0), u32(a.bitrate || 160000), u32(a.bitrate || 160000), desc(5, asc)),
        desc(6, u8([2])));
      return box("mp4a", comun, fullbox("esds", 0, 0, es));
    }
    // Opus: caja dOps (big endian)
    let preskip = 312;
    if (a.description && a.description.length >= 12) preskip = a.description[10] | (a.description[11] << 8);
    const dOps = box("dOps", u8([0, a.channels]), u16(preskip), u32(a.sampleRate), i16(0), u8([0]));
    return box("Opus", comun, dOps);
  }

  function stts(deltas) {
    const runs = [];
    for (const d of deltas) {
      const last = runs[runs.length - 1];
      if (last && last[1] === d) last[0]++;
      else runs.push([1, d]);
    }
    return fullbox("stts", 0, 0, u32(runs.length), ...runs.map(([c, d]) => cat([u32(c), u32(d)])));
  }

  function trak(id, pista, offsets, durMovie) {
    const esVideo = pista.tipo === "video";
    const ts = pista.timescale;
    const deltas = pista.chunks.map((c) => Math.max(1, Math.round((c.dur * ts) / 1e6)));
    const durMedia = deltas.reduce((a, b) => a + b, 0);
    const tkhd = fullbox("tkhd", 0, 3, u32(0), u32(0), u32(id), u32(0), u32(durMovie), zeros(8), u16(0), u16(0),
      u16(esVideo ? 0 : 0x0100), u16(0), MATRIZ, u32(esVideo ? pista.width * 65536 : 0), u32(esVideo ? pista.height * 65536 : 0));
    const mdhd = fullbox("mdhd", 0, 0, u32(0), u32(0), u32(ts), u32(durMedia), u16(0x55c4), u16(0));
    const hdlr = fullbox("hdlr", 0, 0, u32(0), str(esVideo ? "vide" : "soun"), zeros(12), str(esVideo ? "VideoHandler\0" : "SoundHandler\0"));
    const xmhd = esVideo ? fullbox("vmhd", 0, 1, zeros(8)) : fullbox("smhd", 0, 0, zeros(4));
    const dinf = box("dinf", fullbox("dref", 0, 0, u32(1), fullbox("url ", 0, 1)));
    const stsd = fullbox("stsd", 0, 0, u32(1), esVideo ? entradaVideo(pista) : entradaAudio(pista));
    const partes = [stsd, stts(deltas)];
    if (esVideo) {
      const keys = [];
      pista.chunks.forEach((c, i) => c.key && keys.push(i + 1));
      partes.push(fullbox("stss", 0, 0, u32(keys.length), ...keys.map(u32)));
    }
    partes.push(fullbox("stsc", 0, 0, u32(1), u32(1), u32(1), u32(1)));
    partes.push(fullbox("stsz", 0, 0, u32(0), u32(pista.chunks.length), ...pista.chunks.map((c) => u32(c.data.length))));
    partes.push(fullbox("stco", 0, 0, u32(offsets.length), ...offsets.map(u32)));
    const stbl = box("stbl", ...partes);
    return box("trak", tkhd, box("mdia", mdhd, hdlr, box("minf", xmhd, dinf, stbl)));
  }

  // video/audio: { tipo, codec, width, height, description, sampleRate, channels, bitrate, chunks:[{data, ts, dur, key}] }
  function mux(video, audio) {
    const pistas = [];
    if (video && video.chunks.length) pistas.push(Object.assign({ tipo: "video", timescale: 90000 }, video));
    if (audio && audio.chunks.length) pistas.push(Object.assign({ tipo: "audio", timescale: audio.sampleRate }, audio));
    if (!pistas.length) throw new Error("No hay contenido para guardar.");

    // Orden de las muestras en mdat: intercaladas por tiempo
    const orden = [];
    pistas.forEach((p, pi) => p.chunks.forEach((c, ci) => orden.push({ pi, ci, ts: c.ts })));
    orden.sort((a, b) => a.ts - b.ts || a.pi - b.pi);

    const durMs = Math.round(Math.max(...pistas.map((p) => {
      const last = p.chunks[p.chunks.length - 1];
      return (last.ts + last.dur) / 1000;
    })));
    const ftyp = box("ftyp", str("isom"), u32(512), str("isom"), str("iso2"), str("avc1"), str("mp41"));

    const construirMoov = (base) => {
      const offs = pistas.map(() => []);
      let o = base;
      for (const s of orden) {
        offs[s.pi][s.ci] = o;
        o += pistas[s.pi].chunks[s.ci].data.length;
      }
      const mvhd = fullbox("mvhd", 0, 0, u32(0), u32(0), u32(1000), u32(durMs), u32(0x00010000), u16(0x0100), zeros(10), MATRIZ, zeros(24), u32(pistas.length + 1));
      return box("moov", mvhd, ...pistas.map((p, i) => trak(i + 1, p, offs[i], durMs)));
    };
    const tam = construirMoov(0).length;
    const moov = construirMoov(ftyp.length + tam + 8);
    const total = orden.reduce((a, s) => a + pistas[s.pi].chunks[s.ci].data.length, 0);
    const mdat = new Uint8Array(8 + total);
    mdat.set(u32(8 + total), 0);
    mdat.set(str("mdat"), 4);
    let o = 8;
    for (const s of orden) {
      const d = pistas[s.pi].chunks[s.ci].data;
      mdat.set(d, o);
      o += d.length;
    }
    return new Blob([ftyp, moov, mdat], { type: "video/mp4" });
  }

  VS.mp4 = { mux };
})(window.VS);

  <script>
/* Ensamblador de videos en el navegador: clips/imágenes + voz + música + subtítulos + transiciones.
   Exporta cuadro por cuadro con WebCodecs (MP4 H.264/AAC), sin depender de la velocidad del PC
   ni de que la ventana esté visible. Si el navegador no lo permite, graba en tiempo real. */
window.VS = window.VS || {};
(function (VS) {
  "use strict";

  const FORMATOS = {
    "9:16": [1080, 1920],
    "16:9": [1920, 1080],
    "1:1": [1080, 1080],
    "4:5": [1080, 1350],
  };

  class Ensamblador {
    constructor(canvas) {
      this.cv = canvas;
      this.ctx = canvas.getContext("2d");
      this.items = [];          // {tipo, url, el, nombre, dur}
      this.voz = null;          // HTMLAudioElement
      this.musica = null;
      this.volVoz = 1;
      this.volMusica = 0.18;
      this.subs = [];
      this.estilo = { posicion: "franja", color: "#ffcf5c", caja: "glass", tam: 1, mayus: false };
      this.marca = "";
      this.muestra = false;
      this.encuadre = "completa";  // completa (fondo difuminado) · color · llenar (recorta)
      this.colorFondo = "#000000";
      this.movimiento = false;    // acercamiento lento en imágenes
      this.transicion = "fundido"; // fundido · negro · deslizar · zoom · ninguna
      this.durTrans = 0.6;
      this.exacto = false;      // true mientras se exporta cuadro por cuadro
      this.ajustar = true;      // repartir los clips en la duración de la voz
      this.escala = 1;          // 1 = 1080p, 0.6667 = 720p
      this.formato = "9:16";
      this.reproduciendo = false;
      this.alTerminar = null;
      this.alAvanzar = null;
      this.setFormato("9:16");
    }

    setFormato(f, escala) {
      this.formato = f;
      if (escala) this.escala = escala;
      const [w, h] = FORMATOS[f] || FORMATOS["9:16"];
      this.cv.width = Math.round((w * this.escala) / 2) * 2;
      this.cv.height = Math.round((h * this.escala) / 2) * 2;
      this.dibujar(0);
    }

    async agregarArchivo(file) {
      const url = URL.createObjectURL(file);
      if (file.type.startsWith("image/")) {
        const el = new Image();
        el.src = url;
        await el.decode().catch(() => {});
        this.items.push({ tipo: "imagen", url, el, nombre: file.name, dur: 4 });
      } else if (file.type.startsWith("video/")) {
        const el = document.createElement("video");
        el.src = url;
        el.muted = true;
        el.playsInline = true;
        el.preload = "auto";
        el.loop = true;
        await new Promise((res) => {
          el.onloadedmetadata = res;
          el.onerror = res;
        });
        this.items.push({ tipo: "video", url, el, nombre: file.name, dur: isFinite(el.duration) ? el.duration : 8 });
      } else {
        throw new Error(`${file.name} no es imagen ni video.`);
      }
      this.dibujar(0);
    }

    quitar(i) {
      const [it] = this.items.splice(i, 1);
      if (it) URL.revokeObjectURL(it.url);

    mover(i, d) {
      const j = i + d;
      if (j < 0 || j >= this.items.length) return;
      [this.items[i], this.items[j]] = [this.items[j], this.items[i]];
      this.dibujar(0);

    async setAudio(cual, blobOUrl) {
      if (this[cual]) { this[cual].pause(); }
      this[cual + "Blob"] = blobOUrl && typeof blobOUrl !== "string" ? blobOUrl : null;
      this[cual + "Url"] = typeof blobOUrl === "string" ? blobOUrl : null;
      if (!blobOUrl) { this[cual] = null; return 0; }
